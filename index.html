  },
];

function Tutorial({ active, step, onNext, onPrev, onClose }) {
  const [pos, setPos] = React.useState(null);
  const stepData = TUTORIAL_STEPS[step];

  React.useEffect(() => {
    if (!active || !stepData) { setPos(null); return; }
    let cancelled = false;
    const measure = () => {
      if (cancelled) return;
      const selectors = stepData.target.split(', ');
      let el = null;
      for (const sel of selectors) { el = document.querySelector(sel); if (el) break; }
      if (!el) { setPos(null); return; }
      const rect = el.getBoundingClientRect();
      const isVisible = rect.width > 0 && rect.height > 0 && rect.right > 0 && rect.left < window.innerWidth;
      if (!isVisible) { setPos(null); return; }
      if (!stepData.scrollTo) window.scrollTo({ top: 0, behavior: 'instant' });
      else el.scrollIntoView({ behavior: 'instant', block: 'center' });
      const r = el.getBoundingClientRect();
      setPos({ top: r.top - 6, left: r.left - 6, width: r.width + 12, height: r.height + 12 });
    };
    setPos(null);
    const t = setTimeout(measure, 80);
    return () => { cancelled = true; clearTimeout(t); };
  }, [active, step, stepData]);

  if (!active || !stepData) return null;

  const isLast = step === TUTORIAL_STEPS.length - 1;
  const isFirst = step === 0;

  const tooltipStyle = {};
  if (pos) {
    const below = pos.top + pos.height + 14;
    const above = pos.top - 14;
    const fitsBelow = below + 200 < window.innerHeight;
    if (fitsBelow) {
      tooltipStyle.top = below + 'px';
    } else {
      tooltipStyle.bottom = (window.innerHeight - above) + 'px';
    }
    const leftPos = Math.min(Math.max(12, pos.left), window.innerWidth - 380);
    tooltipStyle.left = leftPos + 'px';
  } else {
    tooltipStyle.top = '50%';
    tooltipStyle.left = '50%';
    tooltipStyle.transform = 'translate(-50%, -50%)';
    tooltipStyle.maxWidth = 'calc(100vw - 32px)';
  }

  return (
    <div className="tutorial-overlay">
      {pos && (
        <div className="tutorial-highlight" style={pos} />
      )}
      <div className={'tutorial-backdrop' + (pos ? ' has-highlight' : '')} />
      <div className="tutorial-tooltip" style={tooltipStyle}>
        <div className="tutorial-progress">
          {TUTORIAL_STEPS.map((_, i) => (
            <div key={i} className={'tutorial-dot' + (i === step ? ' active' : i < step ? ' done' : '')} />
          ))}
        </div>
        <h3>{stepData.title}</h3>
        <p>{stepData.text}</p>
        <div className="tutorial-actions">
          <button className="tutorial-btn-skip" onClick={onClose}>Sluiten</button>
          <div style={{ display: 'flex', gap: 6 }}>
            {!isFirst && (
              <button className="tutorial-btn tutorial-btn-secondary" onClick={onPrev}>Vorige</button>
            )}
            <button className="tutorial-btn tutorial-btn-primary" onClick={onNext}>
              {isLast ? 'Afronden' : 'Volgende'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [state, setState] = React.useState(() => loadState());
  const [route, setRoute] = React.useState('dashboard');
  const [showNew, setShowNew] = React.useState(false);
  const [confirmDel, setConfirmDel] = React.useState(null);
  const [sidebarOpen, setSidebarOpen] = React.useState(false);
  const [tutorialActive, setTutorialActive] = React.useState(false);
  const [tutorialStep, setTutorialStep] = React.useState(0);
  const toast = useToast();

  function startTutorial() {
    setSidebarOpen(false);
    setRoute('dashboard');
    setTutorialStep(0);
    setTutorialActive(true);
  }
  function nextTutorialStep() {
    if (tutorialStep >= TUTORIAL_STEPS.length - 1) {
      setTutorialActive(false);
      toast('Tutorial afgerond!');
      return;
    }
    const nextStep = tutorialStep + 1;
    const nextData = TUTORIAL_STEPS[nextStep];
    if (nextData.navigate) setRoute(nextData.navigate);
    setSidebarOpen(false);
    setTutorialStep(nextStep);
  }
  function prevTutorialStep() {
    if (tutorialStep <= 0) return;
    const prev = tutorialStep - 1;
    const prevData = TUTORIAL_STEPS[prev];
    if (prevData.navigate) setRoute(prevData.navigate);
    setSidebarOpen(false);
    setTutorialStep(prev);
  }

  React.useEffect(() => {
    saveState(state);
    document.documentElement.setAttribute('data-theme', state.theme || 'light');
  }, [state]);

  // Current user: default to first Zorgcoordinator, else first user
  const users = state.users || [];
  const currentUserId = state.currentUserId || (users.find(u => u.rol === 'Zorgcoordinator') || users[0])?.id;
  const currentUser = users.find(u => u.id === currentUserId) || users[0] || { naam: 'Onbekend', rol: '—' };
  const can = (perm) => hasPermission(state, currentUser, perm);

  const updateState = (patch) => setState(s => ({ ...s, ...patch }));
  const updateStudent = (next) => setState(s => ({
    ...s,
    students: s.students.map(st => st.id === next.id ? stampAuthor(next, st, currentUser) : st),
  }));
  const addStudent = (newStudent) => setState(s => ({ ...s, students: [stampAuthor(newStudent, null, currentUser), ...s.students] }));

  function createStudent(form) {
    const id = 'st_' + uid();
    const newStudent = {
      id, naam: form.naam.trim(), klas: form.klas.trim(), onderwijsvorm: form.onderwijsvorm,
      bcodes: form.bcodes, dcodes: form.dcodes,
      datumRegistratie: todayISO(),
      schoolActies: {}, afsprakenConsult: '', doelAfspraken: '',
      clbType: '', clbNaam: '', clbActies: {}, clbDoel: '',
      fase: '', evolutie: 'Status quo',
      diensten: {}, notities: [],
      tijdlijn: [{ datum: todayISO(), type: 'Dossier aangemaakt', detail: 'Nieuwe registratie' }],
      laatsteUpdate: todayISO(),
    };
    addStudent(newStudent);
    setShowNew(false);
    toast('Leerling opgeslagen');
    setRoute('leerlingen:' + id);
  }

  function deleteStudent(id) {
    setState(s => ({ ...s, students: s.students.filter(st => st.id !== id) }));
    setConfirmDel(null);
    setRoute('leerlingen');
    toast('Dossier verwijderd');
  }

  function resetData() {
    const fresh = defaultState();
    fresh.theme = state.theme;
    setState(fresh);
    setRoute('dashboard');
  }

  const studentId = route.startsWith('leerlingen:') ? route.split(':')[1] : null;
  const currentStudent = studentId ? state.students.find(s => s.id === studentId) : null;

  // breadcrumb
  const crumbs = (() => {
    if (route === 'dashboard') return [{ label: 'Dashboard' }];
    if (route === 'leerlingen') return [{ label: 'Leerlingen' }];
    if (studentId && currentStudent) return [{ label: 'Leerlingen', go: 'leerlingen' }, { label: currentStudent.naam }];
    if (route === 'clb') return [{ label: 'CLB Overzicht' }];
    if (route === 'statistieken') return [{ label: 'Statistieken' }];
    if (route === 'gebruikers') return [{ label: 'Gebruikers' }];
    if (route === 'instellingen') return [{ label: 'Instellingen' }];
    return [];
  })();

  return (
    <div className="app">
      <div className="mobile-header">
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div className="sidebar-logo">PV</div>
          <div style={{ fontWeight: 600, fontSize: 14 }}>PROVIL</div>
        </div>
        <button className="hamburger" onClick={() => setSidebarOpen(true)} aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
      <div className={'sidebar-overlay' + (sidebarOpen ? ' open' : '')} onClick={() => setSidebarOpen(false)} />
      <Sidebar
        route={route}
        onNavigate={r => { setRoute(r); setSidebarOpen(false); }}
        theme={state.theme || 'light'}
        onToggleTheme={() => updateState({ theme: (state.theme === 'dark' ? 'light' : 'dark') })}
        users={users}
        currentUser={currentUser}
        onSwitchUser={id => updateState({ currentUserId: id })}
        mobileOpen={sidebarOpen}
        onStartTutorial={startTutorial}
      />
      <div className="main">
        <div className="topbar">
          <div className="breadcrumb">
            <span className="crumb">PROVIL</span>
            <Icon name="chevRight" size={12} style={{ color: 'var(--text-faint)' }}/>
            {crumbs.map((c, i) => (
              <React.Fragment key={i}>
                <span
                  className={'crumb' + (i === crumbs.length - 1 ? ' current' : '')}
                  style={{ cursor: c.go ? 'pointer' : 'default' }}
                  onClick={() => c.go && setRoute(c.go)}
                >
                  {c.label}
                </span>
                {i < crumbs.length - 1 && <Icon name="chevRight" size={12} style={{ color: 'var(--text-faint)' }}/>}
              </React.Fragment>
            ))}
          </div>
          <div className="topbar-actions">
            <span className="schoolyear">Schooljaar {state.schooljaar}</span>
          </div>
        </div>

        <div className="content">
          {route === 'dashboard' && (
            <Dashboard state={state} onOpenStudent={id => setRoute('leerlingen:' + id)} onNavigate={setRoute}/>
          )}
          {route === 'leerlingen' && (
            <Students state={state} onOpenStudent={id => setRoute('leerlingen:' + id)} onCreate={() => setShowNew(true)} can={can}/>
          )}
          {studentId && currentStudent && (
            <StudentDetail
              student={currentStudent}
              state={state}
              onUpdate={updateStudent}
              onBack={() => setRoute('leerlingen')}
              onDelete={() => setConfirmDel(currentStudent)}
              can={can}
            />
          )}
          {studentId && !currentStudent && (
            <div className="card card-pad">
              <p>Dossier niet gevonden. <button className="btn btn-sm" onClick={() => setRoute('leerlingen')}>Terug</button></p>
            </div>
          )}
          {route === 'clb' && (
            <CLBOverview state={state} onOpenStudent={id => setRoute('leerlingen:' + id)} onUpdateStudent={updateStudent} onAddStudent={addStudent} can={can}/>
          )}
          {route === 'statistieken' && (
            <Statistieken state={state}/>
          )}
          {route === 'gebruikers' && (
            can('gebruikers_beheren') ? <Gebruikers state={state} onUpdateState={updateState}/> :
            <div className="card card-pad"><p className="muted">Je hebt geen toegang tot gebruikersbeheer.</p></div>
          )}
          {route === 'instellingen' && (
            can('instellingen') ? <Settings state={state} onUpdateState={updateState} onResetData={resetData} can={can}/> :
            <div className="card card-pad"><p className="muted">Je hebt geen toegang tot instellingen.</p></div>
          )}
        </div>
      </div>

      <NewStudentModal open={showNew} onClose={() => setShowNew(false)} onSave={createStudent}/>
      <ConfirmModal
        open={!!confirmDel}
        title="Dossier verwijderen?"
        text={confirmDel ? `Weet je zeker dat je het dossier van ${confirmDel.naam} wil verwijderen? Deze actie kan niet ongedaan gemaakt worden.` : ''}
        confirmLabel="Verwijderen"
        danger
        onCancel={() => setConfirmDel(null)}
        onConfirm={() => deleteStudent(confirmDel.id)}
      />
      <Tutorial
        active={tutorialActive}
        step={tutorialStep}
        onNext={nextTutorialStep}
        onPrev={prevTutorialStep}
        onClose={() => setTutorialActive(false)}
      />
    </div>
  );
}

function Root() {
  return (
    <ToastProvider>
      <App/>
    </ToastProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root/>);
</script>
