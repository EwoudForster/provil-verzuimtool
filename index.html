// clb.jsx — CLB Overzicht (Excel-stijl met inline B/D stepper)

function CLBOverview({ state, onOpenStudent, onUpdateStudent, onAddStudent }) {
  const { students, thresholds, users } = state;
  const toast = useToast();
  const [noteFor, setNoteFor] = React.useState(null);
  const [noteText, setNoteText] = React.useState('');
  const [onlyTraject, setOnlyTraject] = React.useState(true);
  const [query, setQuery] = React.useState('');
  const [fFase, setFFase] = React.useState('');
  const [fNiveau, setFNiveau] = React.useState('');
  const [fOnderwijs, setFOnderwijs] = React.useState('');
  const [fEvoTraject, setFEvoTraject] = React.useState('');
  const [fEvoAfwez, setFEvoAfwez] = React.useState('');
  const [fConsulter, setFConsulter] = React.useState('');
  const [addOpen, setAddOpen] = React.useState(false);

  const allConsulters = [...new Set(students.map(s => s.clbNaam).filter(Boolean))].sort();
  const allOnderwijs = [...new Set(students.map(s => s.onderwijsvorm).filter(Boolean))].sort();

  const baseList = students
    .map(s => ({ ...s, niveau: calcNiveau(s.bcodes, s.dcodes, thresholds, s.onderwijsvorm) }))
    .filter(s => onlyTraject ? s.clbType === 'Traject' : s.clbType);

  const list = baseList.filter(s => {
    if (query) {
      const q = query.toLowerCase();
      if (!s.naam.toLowerCase().includes(q) && !s.klas.toLowerCase().includes(q) && !(s.clbNaam || '').toLowerCase().includes(q)) return false;
    }
    if (fFase && s.fase !== fFase) return false;
    if (fNiveau && s.niveau !== Number(fNiveau)) return false;
    if (fOnderwijs && s.onderwijsvorm !== fOnderwijs) return false;
    if (fEvoTraject && (s.evolutieTraject || 'Status quo') !== fEvoTraject) return false;
    if (fEvoAfwez && (s.evolutie || 'Status quo') !== fEvoAfwez) return false;
    if (fConsulter && s.clbNaam !== fConsulter) return false;
    return true;
  });

  const sorted = [...list].sort((a, b) => {
    if (b.niveau !== a.niveau) return b.niveau - a.niveau;
    return (a.onderwijsvorm || '').localeCompare(b.onderwijsvorm || '');
  });

  function commitCodeCLB(s, field, raw) {
    const v = Math.max(0, parseInt(raw || '0', 10));
    const prev = s[field];
    if (v !== prev) {
      onUpdateStudent({
        ...s,
        [field]: v,
        laatsteUpdate: todayISO(),
        tijdlijn: [{ datum: todayISO(), type: (field === 'bcodes' ? 'B' : 'D') + '-codes via CLB-overzicht', detail: `${prev} → ${v}` }, ...(s.tijdlijn || [])],
      });
    }
  }

  function cycleFase(s) {
    const idx = FASES.indexOf(s.fase);
    const next = FASES[(idx + 1) % FASES.length];
    onUpdateStudent({ ...s, fase: next, laatsteUpdate: todayISO(), tijdlijn: [{ datum: todayISO(), type: 'Fase gewijzigd (CLB-overzicht)', detail: next }, ...(s.tijdlijn || [])] });
    toast('Fase → ' + next);
  }

  function setEvolutie(s, field, value) {
    const label = field === 'evolutieTraject' ? 'Evolutie CLB-traject' : 'Evolutie afwezigheden';
    onUpdateStudent({ ...s, [field]: value, laatsteUpdate: todayISO(), tijdlijn: [{ datum: todayISO(), type: label, detail: value }, ...(s.tijdlijn || [])] });
  }

  function openNote(s) { setNoteFor(s); setNoteText(''); }
  function saveNote() {
    if (!noteText.trim()) { setNoteFor(null); return; }
    const note = { id: uid(), datum: todayISO(), text: noteText.trim() };
    onUpdateStudent({
      ...noteFor,
      notities: [note, ...(noteFor.notities || [])],
      tijdlijn: [{ datum: todayISO(), type: 'Notitie via CLB-overzicht', detail: noteText.slice(0, 60) }, ...(noteFor.tijdlijn || [])],
      laatsteUpdate: todayISO(),
    });
    toast('Notitie toegevoegd');
    setNoteFor(null);
  }

  const counts = { 1: 0, 2: 0, 3: 0 };
  sorted.forEach(s => counts[s.niveau]++);
  const totalB = sorted.reduce((sum, s) => sum + s.bcodes, 0);
  const totalD = sorted.reduce((sum, s) => sum + s.dcodes, 0);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">CLB Overzicht</h1>
          <p className="page-subtitle">Werkblad voor de CLB-medewerker · klik op de evolutie-cel om snel te wisselen</p>
        </div>
        <div className="chip-row">
          <button className="btn btn-primary btn-sm" onClick={() => setAddOpen(true)}>
            <Icon name="plus" size={14}/> Toevoegen aan CLB
          </button>
          <span className="chip"><span className="badge-dot" style={{ color: 'var(--niv3)' }}></span>{counts[3]} · N3</span>
          <span className="chip"><span className="badge-dot" style={{ color: 'var(--niv2)' }}></span>{counts[2]} · N2</span>
          <span className="chip"><span className="badge-dot" style={{ color: 'var(--niv1)' }}></span>{counts[1]} · N1</span>
        </div>
      </div>

      {/* Search row */}
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 10 }}>
        <div className="search-input" style={{ flex: 1, maxWidth: 380 }}>
          <Icon name="search" size={15}/>
          <input type="text" placeholder="Zoek op naam, klas of consulter…" value={query} onChange={e => setQuery(e.target.value)}/>
        </div>
        <label className="filter-chip" style={{ gap: 7, padding: '7px 14px', userSelect: 'none' }}>
          <input type="checkbox" checked={onlyTraject} onChange={e => setOnlyTraject(e.target.checked)} style={{ accentColor: 'var(--primary)' }}/>
          <span>Enkel actieve trajecten</span>
        </label>
        <span className="filter-summary">
          <strong>{sorted.length}</strong> dossiers · <strong>{totalB}</strong> B · <strong>{totalD}</strong> D
        </span>
      </div>

      {/* Filter chips row */}
      <div className="filter-bar" style={{ marginBottom: 16 }}>
        <Icon name="filter" size={14} style={{ color: 'var(--text-muted)', flexShrink: 0 }}/>
        <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', marginRight: 2 }}>Filters</span>
        <div className="filter-sep"></div>

        <label className={'filter-chip' + (fNiveau ? ' active' : '')}>
          <select value={fNiveau} onChange={e => setFNiveau(e.target.value)}>
            <option value="">Niveau</option>
            <option value="3">N3 — Hoog</option>
            <option value="2">N2 — Midden</option>
            <option value="1">N1 — Laag</option>
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fFase ? ' active' : '')}>
          <select value={fFase} onChange={e => setFFase(e.target.value)}>
            <option value="">Fase</option>
            {FASES.map(f => <option key={f} value={f}>{f}</option>)}
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fOnderwijs ? ' active' : '')}>
          <select value={fOnderwijs} onChange={e => setFOnderwijs(e.target.value)}>
            <option value="">Onderwijsvorm</option>
            {allOnderwijs.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fEvoTraject ? ' active' : '')}>
          <select value={fEvoTraject} onChange={e => setFEvoTraject(e.target.value)}>
            <option value="">Evo. traject</option>
            <option value="Positief">↑ Positief</option>
            <option value="Status quo">— Status quo</option>
            <option value="Negatief">↓ Negatief</option>
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fEvoAfwez ? ' active' : '')}>
          <select value={fEvoAfwez} onChange={e => setFEvoAfwez(e.target.value)}>
            <option value="">Evo. afwez.</option>
            <option value="Positief">↑ Positief</option>
            <option value="Status quo">— Status quo</option>
            <option value="Negatief">↓ Negatief</option>
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fConsulter ? ' active' : '')}>
          <select value={fConsulter} onChange={e => setFConsulter(e.target.value)}>
            <option value="">Consulter</option>
            {allConsulters.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        {(fFase || fNiveau || fOnderwijs || fEvoTraject || fEvoAfwez || fConsulter) && (
          <React.Fragment>
            <div className="filter-sep"></div>
            <button className="filter-clear" onClick={() => { setFFase(''); setFNiveau(''); setFOnderwijs(''); setFEvoTraject(''); setFEvoAfwez(''); setFConsulter(''); }}>
              <Icon name="x" size={11}/> Wis alles
            </button>
          </React.Fragment>
        )}
      </div>

      <div className="table-wrap excel-wrap">
        <div className="scroll-x">
          <table className="data-table excel-table">
            <thead>
              <tr>
                <th style={{ width: 36, textAlign: 'center' }}>#</th>
                <th>Naam</th>
                <th>Klas</th>
                <th>Onderwijsvorm</th>
                <th style={{ textAlign: 'center', minWidth: 100 }}>B-codes</th>
                <th style={{ textAlign: 'center', minWidth: 100 }}>D-codes</th>
                <th>Niveau</th>
                <th style={{ minWidth: 130 }}>Fase</th>
                <th style={{ textAlign: 'center' }}>Evo. traject</th>
                <th style={{ textAlign: 'center' }}>Evo. afwez.</th>
                <th>Consulter</th>
                <th style={{ textAlign: 'right' }}>Acties</th>
              </tr>
            </thead>
            <tbody>
              {sorted.length === 0 && (
                <tr><td colSpan={12}>
                  <div className="empty">
                    <div className="empty-illustration"><Icon name="clipboard" size={28}/></div>
                    <div className="empty-title">Geen dossiers in dit overzicht</div>
                    <div className="empty-text">{onlyTraject ? 'Schakel "enkel actieve trajecten" uit om consulten ook te tonen.' : 'Pas je filters aan.'}</div>
                  </div>
                </td></tr>
              )}
              {sorted.map((s, i) => {
                const t = thresholds[s.onderwijsvorm] || defaultThresholds()[s.onderwijsvorm];
                const bHigh = s.bcodes >= t.niv3.b;
                const dHigh = s.dcodes >= t.niv3.d;
                return (
                  <tr key={s.id} className={'excel-row ' + (s.niveau === 3 ? 'row-niv3' : s.niveau === 2 ? 'row-niv2' : '')} style={{ cursor: 'default' }}>
                    <td style={{ textAlign: 'center', color: 'var(--text-faint)', fontVariantNumeric: 'tabular-nums', fontSize: 11.5 }}>{i + 1}</td>
                    <td>
                      <div className="name-cell" style={{ cursor: 'pointer' }} onClick={() => onOpenStudent(s.id)}>
                        <div className="student-avatar">{initials(s.naam)}</div>
                        {s.naam}
                      </div>
                    </td>
                    <td>{s.klas}</td>
                    <td><span className="badge">{s.onderwijsvorm}</span></td>
                    <td style={{ textAlign: 'center' }}>
                      <input type="number" min="0" className={'field-input' + (bHigh ? ' high' : '')} defaultValue={s.bcodes} key={s.id + '-b-' + s.bcodes}
                        style={{ width: 64, textAlign: 'center', fontWeight: 700, fontSize: 15, padding: '4px 6px', fontVariantNumeric: 'tabular-nums' }}
                        onBlur={e => commitCodeCLB(s, 'bcodes', e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                      />
                    </td>
                    <td style={{ textAlign: 'center' }}>
                      <input type="number" min="0" className={'field-input' + (dHigh ? ' high' : '')} defaultValue={s.dcodes} key={s.id + '-d-' + s.dcodes}
                        style={{ width: 64, textAlign: 'center', fontWeight: 700, fontSize: 15, padding: '4px 6px', fontVariantNumeric: 'tabular-nums' }}
                        onBlur={e => commitCodeCLB(s, 'dcodes', e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                      />
                    </td>
                    <td>
                      <span className={'badge ' + nivClass(s.niveau)}><span className="badge-dot"></span> N{s.niveau}</span>
                    </td>
                    <td>
                      <label className={'filter-chip active fase-chip-' + (s.fase || 'none').toLowerCase().replace(/ /g, '-')}>
                        <select value={s.fase || ''} onChange={e => {
                          const next = e.target.value;
                          onUpdateStudent({ ...s, fase: next, laatsteUpdate: todayISO(), tijdlijn: [{ datum: todayISO(), type: 'Fase gewijzigd (CLB-overzicht)', detail: next }, ...(s.tijdlijn || [])] });
                          toast('Fase → ' + next);
                        }}>
                          <option value="">— Kies —</option>
                          {FASES.map(f => <option key={f} value={f}>{f}</option>)}
                        </select>
                        <span className="chevron"><Icon name="chevDown" size={10}/></span>
                      </label>
                    </td>
                    <td style={{ textAlign: 'center' }}>
                      <div style={{ display: 'inline-flex', gap: 4 }}>
                        {['Positief', 'Status quo', 'Negatief'].map(opt => {
                          const active = s.evolutieTraject === opt || (!s.evolutieTraject && opt === 'Status quo');
                          return (
                            <button key={opt} className={'evo-btn' + (active ? ' evo-active' : '')}
                              style={{ opacity: active ? 1 : 0.3, padding: '3px 5px', borderRadius: 6, border: active ? '2px solid var(--primary)' : '2px solid transparent', background: active ? 'var(--primary-light)' : 'none', cursor: 'pointer', transition: 'all .15s' }}
                              title={opt}
                              onClick={() => setEvolutie(s, 'evolutieTraject', opt)}>
                              {opt === 'Positief' && <span className="evo evo-pos"><Icon name="arrowUp" size={14}/></span>}
                              {opt === 'Negatief' && <span className="evo evo-neg"><Icon name="arrowDown" size={14}/></span>}
                              {opt === 'Status quo' && <span className="evo evo-eq"><Icon name="horizontal" size={14}/></span>}
                            </button>
                          );
                        })}
                      </div>
                    </td>
                    <td style={{ textAlign: 'center' }}>
                      <div style={{ display: 'inline-flex', gap: 4 }}>
                        {['Positief', 'Status quo', 'Negatief'].map(opt => {
                          const active = s.evolutie === opt || (!s.evolutie && opt === 'Status quo');
                          return (
                            <button key={opt} className={'evo-btn' + (active ? ' evo-active' : '')}
                              style={{ opacity: active ? 1 : 0.3, padding: '3px 5px', borderRadius: 6, border: active ? '2px solid var(--primary)' : '2px solid transparent', background: active ? 'var(--primary-light)' : 'none', cursor: 'pointer', transition: 'all .15s' }}
                              title={opt}
                              onClick={() => setEvolutie(s, 'evolutie', opt)}>
                              {opt === 'Positief' && <span className="evo evo-pos"><Icon name="arrowUp" size={14}/></span>}
                              {opt === 'Negatief' && <span className="evo evo-neg"><Icon name="arrowDown" size={14}/></span>}
                              {opt === 'Status quo' && <span className="evo evo-eq"><Icon name="horizontal" size={14}/></span>}
                            </button>
                          );
                        })}
                      </div>
                    </td>
                    <td>{s.clbNaam || <span className="muted">—</span>}</td>
                    <td style={{ textAlign: 'right' }}>
                      <div style={{ display: 'inline-flex', gap: 6 }}>
                        <button className="btn btn-sm" onClick={() => openNote(s)} title="Notitie">
                          <Icon name="edit" size={12}/> Notitie
                        </button>
                        <button className="btn btn-sm" onClick={() => onOpenStudent(s.id)} title="Open dossier">
                          <Icon name="folder" size={12}/>
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
            {sorted.length > 0 && (
              <tfoot>
                <tr className="excel-foot">
                  <td></td>
                  <td colSpan={3} style={{ fontWeight: 600 }}>Totaal · {sorted.length} dossier(s)</td>
                  <td style={{ textAlign: 'center', fontWeight: 700, fontVariantNumeric: 'tabular-nums' }}>{totalB}</td>
                  <td style={{ textAlign: 'center', fontWeight: 700, fontVariantNumeric: 'tabular-nums' }}>{totalD}</td>
                  <td colSpan={6}></td>
                </tr>
              </tfoot>
            )}
          </table>
        </div>
      </div>

      <p className="muted mt-2" style={{ fontSize: 12 }}>
        <Icon name="info" size={11}/> Tip: klik op de fase- of evolutie-cel om snel te wisselen. Wijzigingen worden gelogd in de tijdlijn.
      </p>

      {addOpen && (
        <AddToCLBModal
          students={students}
          thresholds={thresholds}
          users={users || []}
          onCancel={() => setAddOpen(false)}
          onAssign={(student, clbType, clbNaam, fase) => {
            onUpdateStudent({
              ...student,
              clbType,
              clbNaam: clbNaam || student.clbNaam,
              fase: fase || student.fase || 'In opstart',
              laatsteUpdate: todayISO(),
              tijdlijn: [{ datum: todayISO(), type: 'CLB ' + clbType.toLowerCase() + ' gestart', detail: clbNaam }, ...(student.tijdlijn || [])],
            });
            toast(student.naam + ' toegevoegd aan CLB');
            setAddOpen(false);
          }}
          onCreateNew={(form) => {
            const id = 'st_' + uid();
            const newStudent = {
              id, naam: form.naam.trim(), klas: form.klas.trim(), onderwijsvorm: form.onderwijsvorm,
              bcodes: form.bcodes, dcodes: form.dcodes,
              datumRegistratie: todayISO(),
              schoolActies: {}, afsprakenConsult: '', doelAfspraken: '',
              clbType: form.clbType, clbNaam: form.clbNaam, clbActies: {}, clbDoel: '',
              fase: form.fase || 'In opstart', evolutie: 'Status quo',
              diensten: {}, notities: [],
              tijdlijn: [
                { datum: todayISO(), type: 'CLB ' + form.clbType.toLowerCase() + ' gestart', detail: form.clbNaam },
                { datum: todayISO(), type: 'Dossier aangemaakt', detail: 'Via CLB-overzicht' },
              ],
              laatsteUpdate: todayISO(),
            };
            onAddStudent(newStudent);
            toast(form.naam + ' toegevoegd');
            setAddOpen(false);
          }}
        />
      )}
    </div>
  );
}

function AddToCLBModal({ students, thresholds, users, onCancel, onAssign, onCreateNew }) {
  const [mode, setMode] = React.useState('existing');
  const [pickedId, setPickedId] = React.useState('');
  const [clbType, setClbType] = React.useState('Traject');
  const [clbNaam, setClbNaam] = React.useState('');
  const [fase, setFase] = React.useState('In opstart');
  const [search, setSearch] = React.useState('');
  const [newForm, setNewForm] = React.useState({ naam: '', klas: '', onderwijsvorm: ONDERWIJSVORMEN[0], bcodes: 0, dcodes: 0 });

  const clbMedewerkers = users.filter(u => u.rol === 'CLB-medewerker' && u.actief).map(u => u.naam);
  const available = students.filter(s => !s.clbType);
  const filtered = available.filter(s => !search || s.naam.toLowerCase().includes(search.toLowerCase()) || s.klas.toLowerCase().includes(search.toLowerCase()));
  const picked = available.find(s => s.id === pickedId);

  function submit() {
    if (mode === 'existing') {
      if (!picked) return;
      onAssign(picked, clbType, clbNaam, fase);
    } else {
      if (!newForm.naam.trim() || !newForm.klas.trim()) return;
      onCreateNew({ ...newForm, clbType, clbNaam, fase });
    }
  }

  const canSave = mode === 'existing' ? !!picked : (newForm.naam.trim() && newForm.klas.trim());

  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal modal-large" onClick={e => e.stopPropagation()}>
        <h3 className="modal-title">Leerling toevoegen aan CLB-overzicht</h3>
        <p className="modal-text">Selecteer een bestaande leerling of registreer een nieuwe. CLB-type en consulter worden meteen ingesteld.</p>

        <div className="radio-group mb-3">
          <button className={'radio-pill' + (mode === 'existing' ? ' selected' : '')} onClick={() => setMode('existing')}>
            <span className="dot"></span> Bestaande leerling
          </button>
          <button className={'radio-pill' + (mode === 'new' ? ' selected' : '')} onClick={() => setMode('new')}>
            <span className="dot"></span> Nieuwe leerling
          </button>
        </div>

        {mode === 'existing' && (
          <div className="modal-form">
            <div className="search-input">
              <Icon name="search" size={14}/>
              <input type="text" placeholder="Zoek leerlingen zonder CLB-traject…" value={search} onChange={e => setSearch(e.target.value)}/>
            </div>
            <div style={{ maxHeight: 220, overflowY: 'auto', border: '1px solid var(--border)', borderRadius: 8, background: 'var(--bg)' }}>
              {filtered.length === 0 && <div className="muted" style={{ padding: 16, fontSize: 13, textAlign: 'center' }}>Geen leerlingen zonder CLB-koppeling.</div>}
              {filtered.map(s => {
                const niv = calcNiveau(s.bcodes, s.dcodes, thresholds, s.onderwijsvorm);
                return (
                  <label key={s.id} className="check-item" style={{ borderRadius: 0, borderBottom: '1px solid var(--border)' }}>
                    <input type="radio" checked={pickedId === s.id} onChange={() => setPickedId(s.id)} style={{ accentColor: 'var(--primary)' }}/>
                    <div style={{ flex: 1, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 13.5 }}>{s.naam}</div>
                        <div className="muted" style={{ fontSize: 12 }}>{s.klas} · {s.onderwijsvorm}</div>
                      </div>
                      <span className={'badge ' + nivClass(niv)}><span className="badge-dot"></span> N{niv}</span>
                    </div>
                  </label>
                );
              })}
            </div>
          </div>
        )}

        {mode === 'new' && (
          <div className="modal-form">
            <div className="field" style={{ margin: 0 }}>
              <label className="field-label">Naam</label>
              <input className="field-input" value={newForm.naam} onChange={e => setNewForm({ ...newForm, naam: e.target.value })} placeholder="Voor- en achternaam" autoFocus/>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div className="field" style={{ margin: 0 }}>
                <label className="field-label">Klas</label>
                <input className="field-input" value={newForm.klas} onChange={e => setNewForm({ ...newForm, klas: e.target.value })} placeholder="bv. 3B"/>
              </div>
              <div className="field" style={{ margin: 0 }}>
                <label className="field-label">Onderwijsvorm</label>
                <select className="field-select" value={newForm.onderwijsvorm} onChange={e => setNewForm({ ...newForm, onderwijsvorm: e.target.value })}>
                  {ONDERWIJSVORMEN.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div className="field" style={{ margin: 0 }}>
                <label className="field-label">B-codes</label>
                <input type="number" min="0" className="field-input" value={newForm.bcodes} onChange={e => setNewForm({ ...newForm, bcodes: Math.max(0, parseInt(e.target.value || '0', 10)) })}/>
              </div>
              <div className="field" style={{ margin: 0 }}>
                <label className="field-label">D-codes</label>
                <input type="number" min="0" className="field-input" value={newForm.dcodes} onChange={e => setNewForm({ ...newForm, dcodes: Math.max(0, parseInt(e.target.value || '0', 10)) })}/>
              </div>
            </div>
          </div>
        )}

        <div className="divider"></div>

        <div className="modal-form">
          <div>
            <label className="field-label">CLB-type</label>
            <div className="radio-group">
              {['Consult', 'Traject'].map(t => (
                <button key={t} className={'radio-pill' + (clbType === t ? ' selected' : '')} onClick={() => setClbType(t)}>
                  <span className="dot"></span>{t}
                </button>
              ))}
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <div className="field" style={{ margin: 0 }}>
              <label className="field-label">Consulter / trajecter</label>
              {clbMedewerkers.length > 0 ? (
                <select className="field-select" value={clbNaam} onChange={e => setClbNaam(e.target.value)}>
                  <option value="">— Kies —</option>
                  {clbMedewerkers.map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              ) : (
                <input className="field-input" value={clbNaam} onChange={e => setClbNaam(e.target.value)} placeholder="Naam consulter"/>
              )}
            </div>
            <div className="field" style={{ margin: 0 }}>
              <label className="field-label">Fase</label>
              <select className="field-select" value={fase} onChange={e => setFase(e.target.value)}>
                {FASES.map(f => <option key={f} value={f}>{f}</option>)}
              </select>
            </div>
          </div>
        </div>

        <div className="modal-actions">
          <button className="btn" onClick={onCancel}>Annuleren</button>
          <button className="btn btn-primary" onClick={submit} disabled={!canSave}>Toevoegen</button>
        </div>
      </div>
    </div>
  );
}

function CodeStepper({ value, high, onDec, onInc }) {
  return (
    <div className="code-cell">
      <button className="code-btn" onClick={onDec} disabled={value === 0} aria-label="Verminderen">−</button>
      <span className={'code-num' + (high ? ' high' : '')}>{value}</span>
      <button className="code-btn" onClick={onInc} aria-label="Verhogen">+</button>
    </div>
  );
}

window.CLBOverview = CLBOverview;

// statistieken.jsx — Statistieken dashboard

function Statistieken({ state }) {
  const { students, thresholds } = state;
  const [fDateFrom, setFDateFrom] = React.useState('');
  const [fDateTo, setFDateTo] = React.useState('');
  const [fOnderwijs, setFOnderwijs] = React.useState('');
  const [fNiveau, setFNiveau] = React.useState('');
  const [fFase, setFFase] = React.useState('');
  const [fConsulter, setFConsulter] = React.useState('');

  const allConsulters = [...new Set(students.map(s => s.clbNaam).filter(Boolean))].sort();
  const allOnderwijs = [...new Set(students.map(s => s.onderwijsvorm).filter(Boolean))].sort();
  const activeFilterCount = [fDateFrom, fDateTo, fOnderwijs, fNiveau, fFase, fConsulter].filter(Boolean).length;

  const base = students.filter(s => {
    if (fDateFrom && s.datumRegistratie < fDateFrom) return false;
    if (fDateTo && s.datumRegistratie > fDateTo) return false;
    if (fOnderwijs && s.onderwijsvorm !== fOnderwijs) return false;
    if (fFase && s.fase !== fFase) return false;
    if (fConsulter && s.clbNaam !== fConsulter) return false;
    return true;
  });

  const enriched = base.map(s => ({ ...s, niveau: calcNiveau(s.bcodes, s.dcodes, thresholds, s.onderwijsvorm) }))
    .filter(s => fNiveau ? s.niveau === Number(fNiveau) : true);
  const clbStudents = enriched.filter(s => s.clbType);
  const trajectStudents = enriched.filter(s => s.clbType === 'Traject');

  // Summary stats
  const totalStudents = enriched.length;
  const totalB = enriched.reduce((s, st) => s + st.bcodes, 0);
  const totalD = enriched.reduce((s, st) => s + st.dcodes, 0);
  const avgB = totalStudents ? (totalB / totalStudents).toFixed(1) : 0;
  const avgD = totalStudents ? (totalD / totalStudents).toFixed(1) : 0;

  // Niveau verdeling
  const nivCounts = { 1: 0, 2: 0, 3: 0 };
  enriched.forEach(s => { if (nivCounts[s.niveau] !== undefined) nivCounts[s.niveau]++; });

  // Onderwijsvorm verdeling
  const ondCounts = {};
  enriched.forEach(s => { ondCounts[s.onderwijsvorm] = (ondCounts[s.onderwijsvorm] || 0) + 1; });

  // Fase verdeling (CLB)
  const faseCounts = {};
  FASES.forEach(f => faseCounts[f] = 0);
  clbStudents.forEach(s => { if (s.fase) faseCounts[s.fase] = (faseCounts[s.fase] || 0) + 1; });

  // Evolutie traject verdeling
  const evoTrajectCounts = { 'Positief': 0, 'Status quo': 0, 'Negatief': 0 };
  trajectStudents.forEach(s => { const v = s.evolutieTraject || 'Status quo'; evoTrajectCounts[v] = (evoTrajectCounts[v] || 0) + 1; });

  // Evolutie afwezigheden verdeling
  const evoAfwezCounts = { 'Positief': 0, 'Status quo': 0, 'Negatief': 0 };
  trajectStudents.forEach(s => { const v = s.evolutie || 'Status quo'; evoAfwezCounts[v] = (evoAfwezCounts[v] || 0) + 1; });

  // B-codes per onderwijsvorm
  const bPerOnd = {};
  enriched.forEach(s => { bPerOnd[s.onderwijsvorm] = (bPerOnd[s.onderwijsvorm] || 0) + s.bcodes; });

  // Top 5 leerlingen met meeste B-codes
  const topB = [...enriched].sort((a, b) => b.bcodes - a.bcodes).slice(0, 5);

  // Consulter workload
  const consulterLoad = {};
  clbStudents.forEach(s => { if (s.clbNaam) consulterLoad[s.clbNaam] = (consulterLoad[s.clbNaam] || 0) + 1; });

  // CLB type verdeling
  const clbTypeCounts = {};
  clbStudents.forEach(s => { clbTypeCounts[s.clbType] = (clbTypeCounts[s.clbType] || 0) + 1; });

  // Externe diensten verdeling
  const dienstCounts = {};
  enriched.forEach(s => {
    if (s.diensten) Object.keys(s.diensten).forEach(d => {
      if (s.diensten[d].active) dienstCounts[d] = (dienstCounts[d] || 0) + 1;
    });
  });

  // Helper: horizontal bar
  function HBar({ data, colorFn }) {
    const max = Math.max(...Object.values(data), 1);
    return (
      <div className="bar-chart">
        {Object.entries(data).map(([label, val]) => (
          <div className="bar-row" key={label}>
            <span className="bar-label">{label}</span>
            <div className="bar-track">
              <div className="bar-seg" style={{ width: (val / max * 100) + '%', background: colorFn ? colorFn(label) : 'var(--primary)' }}></div>
            </div>
            <span className="bar-val">{val}</span>
          </div>
        ))}
      </div>
    );
  }

  // Helper: donut-style stat blocks
  function StatRing({ label, value, total, color }) {
    const pct = total > 0 ? Math.round(value / total * 100) : 0;
    return (
      <div style={{ textAlign: 'center' }}>
        <div style={{ position: 'relative', width: 72, height: 72, margin: '0 auto 8px' }}>
          <svg width="72" height="72" viewBox="0 0 72 72">
            <circle cx="36" cy="36" r="30" fill="none" stroke="var(--border)" strokeWidth="6"/>
            <circle cx="36" cy="36" r="30" fill="none" stroke={color} strokeWidth="6"
              strokeDasharray={`${pct * 1.885} 188.5`}
              strokeLinecap="round" transform="rotate(-90 36 36)" style={{ transition: 'stroke-dasharray .5s' }}/>
          </svg>
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 17 }}>{value}</div>
        </div>
        <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{label}</div>
        <div style={{ fontSize: 11, color: 'var(--text-faint)' }}>{pct}%</div>
      </div>
    );
  }

  const evoColor = v => v === 'Positief' ? 'var(--niv1)' : v === 'Negatief' ? 'var(--niv3)' : 'var(--warning)';
  const nivColor = v => v === '3' || v === 3 ? 'var(--niv3)' : v === '2' || v === 2 ? 'var(--niv2)' : 'var(--niv1)';

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Statistieken</h1>
          <p className="page-subtitle">Overzicht en analyses van het schoolverzuim · {state.schooljaar}</p>
        </div>
      </div>

      {/* Filter bar */}
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 10 }}>
        <span className="filter-summary">
          {activeFilterCount > 0 ? <><strong>{totalStudents}</strong> van {students.length} leerlingen · {activeFilterCount} filter{activeFilterCount > 1 ? 's' : ''} actief</> : <><strong>{totalStudents}</strong> leerlingen</>}
        </span>
      </div>
      <div className="filter-bar" style={{ marginBottom: 20 }}>
        <Icon name="filter" size={14} style={{ color: 'var(--text-muted)', flexShrink: 0 }}/>
        <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', marginRight: 2 }}>Filters</span>
        <div className="filter-sep"></div>

        <label className={'filter-chip' + (fDateFrom ? ' active' : '')} style={{ gap: 4 }}>
          <span style={{ fontSize: 11, opacity: .6 }}>Van</span>
          <input type="date" value={fDateFrom} onChange={e => setFDateFrom(e.target.value)} style={{ border: 'none', background: 'none', font: 'inherit', color: 'inherit', cursor: 'pointer', outline: 'none', width: fDateFrom ? 'auto' : 70 }}/>
        </label>
        <label className={'filter-chip' + (fDateTo ? ' active' : '')} style={{ gap: 4 }}>
          <span style={{ fontSize: 11, opacity: .6 }}>Tot</span>
          <input type="date" value={fDateTo} onChange={e => setFDateTo(e.target.value)} style={{ border: 'none', background: 'none', font: 'inherit', color: 'inherit', cursor: 'pointer', outline: 'none', width: fDateTo ? 'auto' : 70 }}/>
        </label>

        <div className="filter-sep"></div>

        <label className={'filter-chip' + (fOnderwijs ? ' active' : '')}>
          <select value={fOnderwijs} onChange={e => setFOnderwijs(e.target.value)}>
            <option value="">Onderwijsvorm</option>
            {allOnderwijs.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fNiveau ? ' active' : '')}>
          <select value={fNiveau} onChange={e => setFNiveau(e.target.value)}>
            <option value="">Niveau</option>
            <option value="3">N3 — Hoog</option>
            <option value="2">N2 — Midden</option>
            <option value="1">N1 — Laag</option>
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fFase ? ' active' : '')}>
          <select value={fFase} onChange={e => setFFase(e.target.value)}>
            <option value="">Fase</option>
            {FASES.map(f => <option key={f} value={f}>{f}</option>)}
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fConsulter ? ' active' : '')}>
          <select value={fConsulter} onChange={e => setFConsulter(e.target.value)}>
            <option value="">Consulter</option>
            {allConsulters.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        {activeFilterCount > 0 && (
          <React.Fragment>
            <div className="filter-sep"></div>
            <button className="filter-clear" onClick={() => { setFDateFrom(''); setFDateTo(''); setFOnderwijs(''); setFNiveau(''); setFFase(''); setFConsulter(''); }}>
              <Icon name="x" size={11}/> Wis alles
            </button>
          </React.Fragment>
        )}
      </div>

      {/* KPI Cards */}
      <div className="stats-grid" style={{ marginBottom: 24 }}>
        <div className="stat-card">
          <div className="stat-label">Totaal leerlingen</div>
          <div className="stat-value">{totalStudents}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">CLB-dossiers</div>
          <div className="stat-value">{clbStudents.length}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Actieve trajecten</div>
          <div className="stat-value">{trajectStudents.length}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Totaal B-codes</div>
          <div className="stat-value">{totalB}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Totaal D-codes</div>
          <div className="stat-value">{totalD}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Gem. B-codes / leerling</div>
          <div className="stat-value">{avgB}</div>
        </div>
      </div>

      {/* Row 1: Niveau + Fase + CLB type */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16, marginBottom: 16 }}>
        <div className="card card-pad">
          <div className="card-title">Verdeling per niveau</div>
          <div style={{ display: 'flex', justifyContent: 'space-around', padding: '16px 0' }}>
            <StatRing label="Niveau 3" value={nivCounts[3]} total={totalStudents} color="var(--niv3)"/>
            <StatRing label="Niveau 2" value={nivCounts[2]} total={totalStudents} color="var(--niv2)"/>
            <StatRing label="Niveau 1" value={nivCounts[1]} total={totalStudents} color="var(--niv1)"/>
          </div>
        </div>

        <div className="card card-pad">
          <div className="card-title">Fase CLB-trajecten</div>
          <HBar data={faseCounts} colorFn={f => f === 'Moeizaam' ? 'var(--niv3)' : f === 'Afgerond' ? 'var(--niv1)' : f === 'Lopende' ? 'var(--primary)' : 'var(--warning)'}/>
        </div>

        <div className="card card-pad">
          <div className="card-title">Type CLB-begeleiding</div>
          <HBar data={clbTypeCounts} colorFn={() => 'var(--primary)'}/>
        </div>
      </div>

      {/* Row 2: Evolutie traject + Evolutie afwezigheden */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16, marginBottom: 16 }}>
        <div className="card card-pad">
          <div className="card-title">Evolutie CLB-traject</div>
          <div style={{ display: 'flex', justifyContent: 'space-around', padding: '16px 0' }}>
            {Object.entries(evoTrajectCounts).map(([k, v]) => (
              <StatRing key={k} label={k} value={v} total={trajectStudents.length} color={evoColor(k)}/>
            ))}
          </div>
        </div>

        <div className="card card-pad">
          <div className="card-title">Evolutie afwezigheden</div>
          <div style={{ display: 'flex', justifyContent: 'space-around', padding: '16px 0' }}>
            {Object.entries(evoAfwezCounts).map(([k, v]) => (
              <StatRing key={k} label={k} value={v} total={trajectStudents.length} color={evoColor(k)}/>
            ))}
          </div>
        </div>

        <div className="card card-pad">
          <div className="card-title">Consulter werkbelasting</div>
          <HBar data={consulterLoad} colorFn={() => 'var(--primary)'}/>
        </div>
      </div>

      {/* Row 3: B-codes per onderwijsvorm + Top 5 + Externe diensten */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16, marginBottom: 16 }}>
        <div className="card card-pad">
          <div className="card-title">B-codes per onderwijsvorm</div>
          <HBar data={bPerOnd} colorFn={() => 'var(--niv3)'}/>
        </div>

        <div className="card card-pad">
          <div className="card-title">Leerlingen per onderwijsvorm</div>
          <HBar data={ondCounts} colorFn={() => 'var(--primary)'}/>
        </div>

        {Object.keys(dienstCounts).length > 0 && (
          <div className="card card-pad">
            <div className="card-title">Externe diensten ingeschakeld</div>
            <HBar data={dienstCounts} colorFn={() => 'var(--warning)'}/>
          </div>
        )}
      </div>

      {/* Top B-codes tabel */}
      <div className="card card-pad" style={{ marginBottom: 16 }}>
        <div className="card-title">Top 5 — Hoogste B-codes</div>
        <div className="table-wrap">
          <table className="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Naam</th>
                <th>Klas</th>
                <th>Onderwijsvorm</th>
                <th style={{ textAlign: 'center' }}>B-codes</th>
                <th style={{ textAlign: 'center' }}>D-codes</th>
                <th>Niveau</th>
                <th>Fase</th>
              </tr>
            </thead>
            <tbody>
              {topB.map((s, i) => {
                const niv = calcNiveau(s.bcodes, s.dcodes, thresholds, s.onderwijsvorm);
                return (
                  <tr key={s.id}>
                    <td>{i + 1}</td>
                    <td style={{ fontWeight: 600 }}>{s.naam}</td>
                    <td>{s.klas}</td>
                    <td><span className="badge">{s.onderwijsvorm}</span></td>
                    <td style={{ textAlign: 'center', fontWeight: 700, color: 'var(--niv3)' }}>{s.bcodes}</td>
                    <td style={{ textAlign: 'center', fontWeight: 700 }}>{s.dcodes}</td>
                    <td><span className={'badge ' + nivClass(niv)}><span className="badge-dot"></span> N{niv}</span></td>
                    <td>{s.fase || '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Top D-codes tabel */}
      <div className="card card-pad">
        <div className="card-title">Top 5 — Hoogste D-codes (te laat)</div>
        <div className="table-wrap">
          <table className="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Naam</th>
                <th>Klas</th>
                <th>Onderwijsvorm</th>
                <th style={{ textAlign: 'center' }}>B-codes</th>
                <th style={{ textAlign: 'center' }}>D-codes</th>
                <th>Niveau</th>
              </tr>
            </thead>
            <tbody>
              {[...enriched].sort((a, b) => b.dcodes - a.dcodes).slice(0, 5).map((s, i) => {
                const niv = calcNiveau(s.bcodes, s.dcodes, thresholds, s.onderwijsvorm);
                return (
                  <tr key={s.id}>
                    <td>{i + 1}</td>
                    <td style={{ fontWeight: 600 }}>{s.naam}</td>
                    <td>{s.klas}</td>
                    <td><span className="badge">{s.onderwijsvorm}</span></td>
                    <td style={{ textAlign: 'center', fontWeight: 700 }}>{s.bcodes}</td>
                    <td style={{ textAlign: 'center', fontWeight: 700, color: 'var(--warning)' }}>{s.dcodes}</td>
                    <td><span className={'badge ' + nivClass(niv)}><span className="badge-dot"></span> N{niv}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {/* Periodevergelijking */}
      {(() => {
        const schoolYear = state.schooljaar || '2025-2026';
        const syStart = parseInt(schoolYear.split('-')[0]);
        const presets = [
          { label: 'Vorig schooljaar', from: (syStart - 1) + '-09-01', to: syStart + '-06-30' },
          { label: 'Huidig schooljaar', from: syStart + '-09-01', to: (syStart + 1) + '-06-30' },
          { label: 'Laatste 3 maanden', from: (() => { const d = new Date(); d.setMonth(d.getMonth() - 3); return d.toISOString().slice(0, 10); })(), to: todayISO() },
          { label: 'Laatste 6 maanden', from: (() => { const d = new Date(); d.setMonth(d.getMonth() - 6); return d.toISOString().slice(0, 10); })(), to: todayISO() },
        ];

        const [pFrom1, setPFrom1] = React.useState(presets[0].from);
        const [pTo1, setPTo1] = React.useState(presets[0].to);
        const [pFrom2, setPFrom2] = React.useState(presets[1].from);
        const [pTo2, setPTo2] = React.useState(presets[1].to);

        function statsForPeriod(from, to) {
          const inRange = students.filter(s => s.datumRegistratie >= from && s.datumRegistratie <= to);
          const enr = inRange.map(s => ({ ...s, niveau: calcNiveau(s.bcodes, s.dcodes, thresholds, s.onderwijsvorm) }));
          return {
            count: inRange.length,
            totalB: inRange.reduce((s, st) => s + st.bcodes, 0),
            totalD: inRange.reduce((s, st) => s + st.dcodes, 0),
            avgB: inRange.length ? (inRange.reduce((s, st) => s + st.bcodes, 0) / inRange.length).toFixed(1) : '0',
            clb: inRange.filter(s => s.clbType).length,
            traject: inRange.filter(s => s.clbType === 'Traject').length,
            n3: enr.filter(s => s.niveau === 3).length,
            n2: enr.filter(s => s.niveau === 2).length,
            n1: enr.filter(s => s.niveau === 1).length,
          };
        }

        const s1 = statsForPeriod(pFrom1, pTo1);
        const s2 = statsForPeriod(pFrom2, pTo2);

        function CompRow({ label, v1, v2, fmt }) {
          const a = fmt ? fmt(v1) : v1;
          const b = fmt ? fmt(v2) : v2;
          const diff = typeof v1 === 'number' && typeof v2 === 'number' ? v2 - v1 : null;
          return (
            <tr>
              <td style={{ fontWeight: 500 }}>{label}</td>
              <td style={{ textAlign: 'center', fontVariantNumeric: 'tabular-nums' }}>{a}</td>
              <td style={{ textAlign: 'center', fontVariantNumeric: 'tabular-nums' }}>{b}</td>
              <td style={{ textAlign: 'center', fontWeight: 600, color: diff === null ? 'var(--text-muted)' : diff > 0 ? 'var(--niv3)' : diff < 0 ? 'var(--niv1)' : 'var(--text-muted)' }}>
                {diff === null ? '—' : (diff > 0 ? '+' : '') + diff}
              </td>
            </tr>
          );
        }

        function applyPreset(idx, target) {
          const p = presets[idx];
          if (target === 1) { setPFrom1(p.from); setPTo1(p.to); }
          else { setPFrom2(p.from); setPTo2(p.to); }
        }

        return (
          <div className="card card-pad" style={{ marginTop: 16 }}>
            <div className="card-title">Periodevergelijking</div>
            <p className="muted" style={{ fontSize: 12, marginTop: -4, marginBottom: 16 }}>Vergelijk twee periodes op basis van registratiedatum</p>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
              <div style={{ padding: 12, background: 'var(--bg-elevated)', borderRadius: 8, border: '1px solid var(--border)' }}>
                <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8, color: 'var(--primary)' }}>Periode A</div>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 8 }}>
                  {presets.map((p, i) => (
                    <button key={i} className="btn btn-sm" onClick={() => applyPreset(i, 1)} style={{ fontSize: 10.5 }}>{p.label}</button>
                  ))}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <input type="date" className="field-input" value={pFrom1} onChange={e => setPFrom1(e.target.value)} style={{ fontSize: 12 }}/>
                  <input type="date" className="field-input" value={pTo1} onChange={e => setPTo1(e.target.value)} style={{ fontSize: 12 }}/>
                </div>
              </div>
              <div style={{ padding: 12, background: 'var(--bg-elevated)', borderRadius: 8, border: '1px solid var(--border)' }}>
                <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8, color: 'var(--niv2)' }}>Periode B</div>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 8 }}>
                  {presets.map((p, i) => (
                    <button key={i} className="btn btn-sm" onClick={() => applyPreset(i, 2)} style={{ fontSize: 10.5 }}>{p.label}</button>
                  ))}
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <input type="date" className="field-input" value={pFrom2} onChange={e => setPFrom2(e.target.value)} style={{ fontSize: 12 }}/>
                  <input type="date" className="field-input" value={pTo2} onChange={e => setPTo2(e.target.value)} style={{ fontSize: 12 }}/>
                </div>
              </div>
            </div>

            <div className="table-wrap">
              <table className="data-table">
                <thead>
                  <tr>
                    <th>Indicator</th>
                    <th style={{ textAlign: 'center' }}>Periode A</th>
                    <th style={{ textAlign: 'center' }}>Periode B</th>
                    <th style={{ textAlign: 'center' }}>Verschil</th>
                  </tr>
                </thead>
                <tbody>
                  <CompRow label="Leerlingen" v1={s1.count} v2={s2.count}/>
                  <CompRow label="Totaal B-codes" v1={s1.totalB} v2={s2.totalB}/>
                  <CompRow label="Totaal D-codes" v1={s1.totalD} v2={s2.totalD}/>
                  <CompRow label="Gem. B-codes" v1={parseFloat(s1.avgB)} v2={parseFloat(s2.avgB)}/>
                  <CompRow label="CLB-dossiers" v1={s1.clb} v2={s2.clb}/>
                  <CompRow label="Actieve trajecten" v1={s1.traject} v2={s2.traject}/>
                  <CompRow label="Niveau 3" v1={s1.n3} v2={s2.n3}/>
                  <CompRow label="Niveau 2" v1={s1.n2} v2={s2.n2}/>
                  <CompRow label="Niveau 1" v1={s1.n1} v2={s2.n1}/>
                </tbody>
              </table>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

window.Statistieken = Statistieken;

// settings.jsx — instellingen + drempels + import/export

function Settings({ state, onUpdateState, onResetData, can }) {
  const toast = useToast();
  const [confirmReset, setConfirmReset] = React.useState(false);

  function setThreshold(onderwijsvorm, niv, code, value) {
    const v = Math.max(0, parseInt(value || '0', 10));
    const next = JSON.parse(JSON.stringify(state.thresholds));
    next[onderwijsvorm][niv][code] = v;
    onUpdateState({ thresholds: next });
  }

  function exportCSV() {
    download('provil_verzuim_' + state.schooljaar + '.csv', studentsToCSV(state.students), 'text/csv');
    toast('CSV geexporteerd');
  }
  function exportJSON() {
    download('provil_verzuim_' + state.schooljaar + '.json', JSON.stringify(state, null, 2), 'application/json');
    toast('JSON geexporteerd');
  }
  function importJSON(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.students) throw new Error('Geen students-veld');
        onUpdateState(parsed);
        toast('Data geimporteerd');
      } catch (err) {
        toast('Import mislukt: ' + err.message, 'error');
      }
    };
    reader.readAsText(f);
    e.target.value = '';
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Instellingen</h1>
          <p className="page-subtitle">Drempelwaarden, schooljaar en data-beheer</p>
        </div>
      </div>

      <div className="card section-block">
        <div className="card-header">
          <div>
            <div className="card-title">Drempelwaarden per onderwijsvorm</div>
            <div className="card-subtitle">Bepaalt automatisch de inschaling (Niveau 1/2/3) per dossier</div>
          </div>
        </div>
        <div className="scroll-x">
          <table className="settings-table">
            <thead>
              <tr>
                <th>Onderwijsvorm</th>
                <th>Niveau 1 — bovengrens</th>
                <th>Niveau 2 — bovengrens</th>
                <th>Niveau 3 — vanaf</th>
              </tr>
            </thead>
            <tbody>
              {ONDERWIJSVORMEN.map(o => {
                const t = state.thresholds[o];
                return (
                  <tr key={o}>
                    <td>{o}</td>
                    <td>
                      <div className="threshold-cell">
                        B ≤ <input type="number" min="0" className="threshold-input" value={t.niv1.b} onChange={e => setThreshold(o, 'niv1', 'b', e.target.value)}/>
                        <span>·</span>
                        D ≤ <input type="number" min="0" className="threshold-input" value={t.niv1.d} onChange={e => setThreshold(o, 'niv1', 'd', e.target.value)}/>
                      </div>
                    </td>
                    <td>
                      <div className="threshold-cell">
                        B ≤ <input type="number" min="0" className="threshold-input" value={t.niv2.b} onChange={e => setThreshold(o, 'niv2', 'b', e.target.value)}/>
                        <span>·</span>
                        D ≤ <input type="number" min="0" className="threshold-input" value={t.niv2.d} onChange={e => setThreshold(o, 'niv2', 'd', e.target.value)}/>
                      </div>
                    </td>
                    <td>
                      <div className="threshold-cell">
                        B ≥ <input type="number" min="0" className="threshold-input" value={t.niv3.b} onChange={e => setThreshold(o, 'niv3', 'b', e.target.value)}/>
                        <span>of</span>
                        D ≥ <input type="number" min="0" className="threshold-input" value={t.niv3.d} onChange={e => setThreshold(o, 'niv3', 'd', e.target.value)}/>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div className="two-col">
        <div className="card card-pad">
          <h3 className="card-title mb-3">Schooljaar</h3>
          <input className="field-input" value={state.schooljaar} onChange={e => onUpdateState({ schooljaar: e.target.value })}/>
          <p className="muted mt-2" style={{ fontSize: 12.5 }}>Wordt getoond in de zijbalk en bij export-bestandsnamen.</p>
        </div>

        <div className="card card-pad">
          <h3 className="card-title mb-3">Data-beheer</h3>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <button className="btn" onClick={exportCSV}><Icon name="download" size={14}/> Export CSV</button>
            <button className="btn" onClick={exportJSON}><Icon name="download" size={14}/> Export JSON</button>
            <label className="btn">
              <Icon name="upload" size={14}/> Importeer JSON
              <input type="file" accept="application/json,.json" style={{ display: 'none' }} onChange={importJSON}/>
            </label>
          </div>
          <div className="divider"></div>
          <button className="btn btn-danger btn-sm" onClick={() => setConfirmReset(true)}>
            <Icon name="trash" size={13}/> Alle data resetten
          </button>
          <p className="muted mt-2" style={{ fontSize: 12 }}>Verwijdert alle dossiers en zet de voorbeelddata terug.</p>
        </div>
      </div>

      <ConfirmModal
        open={confirmReset}
        title="Alle data resetten?"
        text="Dit verwijdert alle huidige leerlingen en zet de voorbeelddata terug. Deze actie kan niet ongedaan gemaakt worden."
        confirmLabel="Ja, reset"
        danger
        onCancel={() => setConfirmReset(false)}
        onConfirm={() => { onResetData(); setConfirmReset(false); toast('Data gereset'); }}
      />
    </div>
  );
}

window.Settings = Settings;

// gebruikers.jsx — user management

function Gebruikers({ state, onUpdateState }) {
  const toast = useToast();
  const [editing, setEditing] = React.useState(null);
  const [confirmDel, setConfirmDel] = React.useState(null);
  const [query, setQuery] = React.useState('');
  const [fRol, setFRol] = React.useState('');
  const [activeTab, setActiveTab] = React.useState('users'); // 'users' | 'rollen'
  const [newRolNaam, setNewRolNaam] = React.useState('');
  const [selectedRol, setSelectedRol] = React.useState(null);

  const rollen = getRollen(state);
  const users = state.users || [];
  const filtered = users.filter(u => {
    if (query && !u.naam.toLowerCase().includes(query.toLowerCase()) && !u.email.toLowerCase().includes(query.toLowerCase())) return false;
    if (fRol && u.rol !== fRol) return false;
    return true;
  });

  function saveUser(u) {
    if (u.__new) {
      const nu = { id: 'u_' + uid(), actief: true, laatsteLogin: '—', ...u };
      delete nu.__new;
      onUpdateState({ users: [nu, ...users] });
      toast('Gebruiker toegevoegd');
    } else {
      onUpdateState({ users: users.map(x => x.id === u.id ? u : x) });
      toast('Gebruiker opgeslagen');
    }
    setEditing(null);
  }

  function toggleActief(u) {
    onUpdateState({ users: users.map(x => x.id === u.id ? { ...x, actief: !x.actief } : x) });
    toast(u.actief ? 'Gedeactiveerd' : 'Geactiveerd');
  }

  function deleteUser(id) {
    onUpdateState({ users: users.filter(x => x.id !== id) });
    setConfirmDel(null);
    toast('Gebruiker verwijderd');
  }

  function addRol() {
    const naam = newRolNaam.trim();
    if (!naam || rollen.includes(naam)) { toast('Rol bestaat al of naam is leeg'); return; }
    const next = [...rollen, naam];
    const perms = JSON.parse(JSON.stringify(state.rolePermissions || {}));
    perms[naam] = [];
    onUpdateState({ rollen: next, rolePermissions: perms });
    setNewRolNaam('');
    toast(`Rol "${naam}" aangemaakt`);
  }

  function deleteRol(rol) {
    if (rol === 'Zorgcoordinator') return;
    const usersWithRol = users.filter(u => u.rol === rol);
    if (usersWithRol.length > 0) { toast(`Kan niet verwijderen: ${usersWithRol.length} gebruiker(s) hebben deze rol`); return; }
    const next = rollen.filter(r => r !== rol);
    const perms = JSON.parse(JSON.stringify(state.rolePermissions || {}));
    delete perms[rol];
    onUpdateState({ rollen: next, rolePermissions: perms });
    toast(`Rol "${rol}" verwijderd`);
  }

  function togglePermission(rol, key, checked) {
    const custom = JSON.parse(JSON.stringify(state.rolePermissions || {}));
    const cur = custom[rol] || [...(DEFAULT_ROLE_PERMISSIONS[rol] || [])];
    if (checked) { if (!cur.includes(key)) cur.push(key); }
    else { const idx = cur.indexOf(key); if (idx >= 0) cur.splice(idx, 1); }
    custom[rol] = cur;
    onUpdateState({ rolePermissions: custom });
  }

  const counts = { total: users.length, actief: users.filter(u => u.actief).length };
  const perRol = {};
  rollen.forEach(r => perRol[r] = users.filter(u => u.rol === r).length);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Gebruikers & Rollen</h1>
          <p className="page-subtitle">{counts.total} accounts · {counts.actief} actief · {rollen.length} rollen</p>
        </div>
        {activeTab === 'users' && (
          <button className="btn btn-primary" onClick={() => setEditing({ __new: true, naam: '', email: '', rol: rollen[0] })}>
            <Icon name="plus" size={15} /> Nieuwe gebruiker
          </button>
        )}
      </div>

      <div className="tabs" style={{ marginBottom: 18 }}>
        <button className={'tab' + (activeTab === 'users' ? ' active' : '')} onClick={() => setActiveTab('users')}>
          <Icon name="users" size={14} style={{ marginRight: 6 }}/> Gebruikers
        </button>
        <button className={'tab' + (activeTab === 'rollen' ? ' active' : '')} onClick={() => setActiveTab('rollen')}>
          <Icon name="settings" size={14} style={{ marginRight: 6 }}/> Rollen & Rechten
        </button>
      </div>

      {activeTab === 'users' && <>
      <div className="stats-grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))' }}>
        {rollen.map(r => (
          <div className="stat-card" key={r}>
            <div className="stat-label">{r}</div>
            <div className="stat-value" style={{ fontSize: 24 }}>{perRol[r] || 0}</div>
            <div className="stat-meta">accounts</div>
          </div>
        ))}
      </div>

      <div className="filterbar">
        <div className="search-input">
          <Icon name="search" size={15} />
          <input type="text" placeholder="Zoek op naam of e-mail…" value={query} onChange={e => setQuery(e.target.value)}/>
        </div>
        <select className="dropdown" value={fRol} onChange={e => setFRol(e.target.value)}>
          <option value="">Alle rollen</option>
          {rollen.map(r => <option key={r} value={r}>{r}</option>)}
        </select>
      </div>

      <div className="table-wrap">
        <div className="scroll-x">
          <table className="data-table">
            <thead>
              <tr>
                <th>Naam</th>
                <th>E-mail</th>
                <th>Rol</th>
                <th>Status</th>
                <th>Laatste login</th>
                <th style={{ textAlign: 'right' }}>Acties</th>
              </tr>
            </thead>
            <tbody>
              {filtered.length === 0 && (
                <tr><td colSpan={6}>
                  <div className="empty">
                    <div className="empty-illustration"><Icon name="users" size={28}/></div>
                    <div className="empty-title">Geen gebruikers gevonden</div>
                    <div className="empty-text">Pas filters aan of voeg een nieuwe gebruiker toe.</div>
                  </div>
                </td></tr>
              )}
              {filtered.map(u => (
                <tr key={u.id} style={{ cursor: 'default', opacity: u.actief ? 1 : 0.55 }}>
                  <td>
                    <div className="name-cell">
                      <div className="student-avatar" style={{ background: 'linear-gradient(135deg, #fbbf24, #f59e0b)', color: 'white' }}>{initials(u.naam)}</div>
                      {u.naam}
                    </div>
                  </td>
                  <td><span className="muted">{u.email}</span></td>
                  <td><span className={'badge ' + (u.rol === 'CLB-medewerker' ? 'badge-primary' : '')}>{u.rol}</span></td>
                  <td>
                    {u.actief
                      ? <span className="badge badge-niv1"><span className="badge-dot"></span> Actief</span>
                      : <span className="badge"><span className="badge-dot"></span> Inactief</span>}
                  </td>
                  <td><span className="muted">{u.laatsteLogin === '—' ? '—' : fmtDate(u.laatsteLogin)}</span></td>
                  <td style={{ textAlign: 'right' }}>
                    <div style={{ display: 'inline-flex', gap: 6 }}>
                      <button className="btn btn-sm" onClick={() => setEditing({ ...u })} title="Bewerken"><Icon name="edit" size={12}/></button>
                      <button className="btn btn-sm" onClick={() => toggleActief(u)} title={u.actief ? 'Deactiveren' : 'Activeren'}>
                        {u.actief ? 'Deactiveren' : 'Activeren'}
                      </button>
                      <button className="btn btn-sm" onClick={() => setConfirmDel(u)} title="Verwijderen"><Icon name="trash" size={12}/></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      </>}

      {activeTab === 'rollen' && <>
        {!selectedRol ? (
          /* === Rollen overzicht === */
          <div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 12, marginBottom: 16 }}>
              {rollen.map(r => {
                const perms = getRolePermissions(state, r);
                const count = perRol[r] || 0;
                const isZorg = r === 'Zorgcoordinator';
                return (
                  <div key={r} className="card" style={{ cursor: 'pointer', transition: 'box-shadow .15s, border-color .15s' }}
                    onClick={() => setSelectedRol(r)}
                    onMouseOver={e => e.currentTarget.style.borderColor = 'var(--primary)'}
                    onMouseOut={e => e.currentTarget.style.borderColor = ''}>
                    <div style={{ padding: '18px 20px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 15 }}>{r}</div>
                          <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>
                            {count} gebruiker{count !== 1 ? 's' : ''} · {perms.length} rechten
                          </div>
                        </div>
                        {isZorg && <span className="badge badge-niv1" style={{ fontSize: 10 }}>Admin</span>}
                      </div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                        {perms.slice(0, 4).map(p => (
                          <span key={p} className="badge" style={{ fontSize: 10 }}>{(PERMISSIONS[p] || {}).label || p}</span>
                        ))}
                        {perms.length > 4 && <span className="badge" style={{ fontSize: 10 }}>+{perms.length - 4}</span>}
                        {perms.length === 0 && <span className="muted" style={{ fontSize: 11 }}>Geen rechten</span>}
                      </div>
                    </div>
                  </div>
                );
              })}

              {/* Nieuwe rol kaart */}
              <div className="card" style={{ border: '2px dashed var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 120 }}>
                <div style={{ padding: 20, textAlign: 'center', width: '100%' }}>
                  <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
                    <input className="field-input" value={newRolNaam} onChange={e => setNewRolNaam(e.target.value)} placeholder="Nieuwe rol…"
                      onKeyDown={e => { if (e.key === 'Enter') addRol(); }}
                      style={{ maxWidth: 160, textAlign: 'center' }}/>
                    <button className="btn btn-primary btn-sm" onClick={addRol} disabled={!newRolNaam.trim()}>
                      <Icon name="plus" size={12}/>
                    </button>
                  </div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 8 }}>Nieuwe rol toevoegen</div>
                </div>
              </div>
            </div>
          </div>
        ) : (
          /* === Rol detail: rechten bewerken === */
          <div>
            <button className="back-link" onClick={() => setSelectedRol(null)} style={{ marginBottom: 16 }}>
              <Icon name="chevLeft" size={14}/> Terug naar rollen
            </button>

            <div className="card" style={{ marginBottom: 16 }}>
              <div style={{ padding: '20px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
                <div>
                  <h2 style={{ margin: '0 0 4px', fontSize: 20 }}>{selectedRol}</h2>
                  <div className="muted" style={{ fontSize: 13 }}>
                    {perRol[selectedRol] || 0} gebruiker{(perRol[selectedRol] || 0) !== 1 ? 's' : ''} met deze rol
                    {selectedRol === 'Zorgcoordinator' && ' · Heeft altijd alle rechten'}
                  </div>
                </div>
                {selectedRol !== 'Zorgcoordinator' && (perRol[selectedRol] || 0) === 0 && (
                  <button className="btn btn-sm" style={{ color: 'var(--niv3)' }} onClick={() => { deleteRol(selectedRol); setSelectedRol(null); }}>
                    <Icon name="trash" size={13}/> Rol verwijderen
                  </button>
                )}
              </div>
            </div>

            <div className="card">
              <div style={{ padding: '16px 24px 8px' }}>
                <h3 style={{ margin: '0 0 4px', fontSize: 15 }}>Rechten</h3>
                <p className="muted" style={{ margin: '0 0 12px', fontSize: 12 }}>Vink aan welke acties deze rol mag uitvoeren</p>
              </div>
              <div style={{ padding: '0 12px 16px' }}>
                {Object.entries(PERMISSIONS).map(([key, perm]) => {
                  const perms = getRolePermissions(state, selectedRol);
                  const checked = perms.includes(key);
                  const isZorg = selectedRol === 'Zorgcoordinator';
                  return (
                    <label key={key} className={'check-item' + (checked ? ' checked' : '')}
                      style={{ cursor: isZorg ? 'default' : 'pointer', padding: '12px 14px', display: 'flex', alignItems: 'flex-start', gap: 12 }}>
                      <input type="checkbox" checked={checked} disabled={isZorg}
                        onChange={e => {
                          togglePermission(selectedRol, key, e.target.checked);
                          toast(`${e.target.checked ? '✓' : '✗'} ${perm.label}`);
                        }}
                        style={{ marginTop: 2 }}
                      />
                      <div style={{ flex: 1 }}>
                        <div className="check-label">{perm.label}</div>
                        <div className="check-desc">{perm.desc}</div>
                      </div>
                    </label>
                  );
                })}
              </div>
            </div>

            {selectedRol !== 'Zorgcoordinator' && (perRol[selectedRol] || 0) > 0 && (
              <div className="card" style={{ marginTop: 16 }}>
                <div style={{ padding: '16px 24px 8px' }}>
                  <h3 style={{ margin: '0 0 8px', fontSize: 15 }}>Gebruikers met deze rol</h3>
                </div>
                <div style={{ padding: '0 24px 16px' }}>
                  {users.filter(u => u.rol === selectedRol).map(u => (
                    <div key={u.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: '1px solid var(--border)' }}>
                      <div className="student-avatar" style={{ background: 'linear-gradient(135deg, #fbbf24, #f59e0b)', color: 'white', width: 28, height: 28, fontSize: 10 }}>{initials(u.naam)}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>{u.naam}</div>
                        <div className="muted" style={{ fontSize: 11 }}>{u.email}</div>
                      </div>
                      <span className={'badge ' + (u.actief ? 'badge-niv1' : '')} style={{ fontSize: 10 }}>{u.actief ? 'Actief' : 'Inactief'}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}
      </>}

      {editing && <UserEditModal user={editing} rollen={rollen} onCancel={() => setEditing(null)} onSave={saveUser}/>}
      <ConfirmModal
        open={!!confirmDel}
        title="Gebruiker verwijderen?"
        text={confirmDel ? `Weet je zeker dat je ${confirmDel.naam} wil verwijderen?` : ''}
        confirmLabel="Verwijderen"
        danger
        onCancel={() => setConfirmDel(null)}
        onConfirm={() => deleteUser(confirmDel.id)}
      />
    </div>
  );
}

function UserEditModal({ user, rollen, onCancel, onSave }) {
  const rollenList = rollen || ROLLEN;
  const [form, setForm] = React.useState(user);
  const canSave = form.naam.trim() && form.email.trim() && form.rol;
  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3 className="modal-title">{user.__new ? 'Nieuwe gebruiker' : 'Gebruiker bewerken'}</h3>
        <p className="modal-text">Voor demo: er wordt geen e-mail verstuurd.</p>
        <div className="modal-form">
          <div className="field" style={{ margin: 0 }}>
            <label className="field-label">Naam</label>
            <input className="field-input" autoFocus value={form.naam} onChange={e => setForm({ ...form, naam: e.target.value })}/>
          </div>
          <div className="field" style={{ margin: 0 }}>
            <label className="field-label">E-mail</label>
            <input className="field-input" type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })}/>
          </div>
          <div className="field" style={{ margin: 0 }}>
            <label className="field-label">Rol</label>
            <select className="field-select" value={form.rol} onChange={e => setForm({ ...form, rol: e.target.value })}>
              {rollenList.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          {!user.__new && (
            <label className="check-item" style={{ background: 'var(--bg-subtle)' }}>
              <input type="checkbox" checked={form.actief} onChange={e => setForm({ ...form, actief: e.target.checked })}/>
              <span className="check-label">Account actief</span>
            </label>
          )}
        </div>
        <div className="modal-actions">
          <button className="btn" onClick={onCancel}>Annuleren</button>
          <button className="btn btn-primary" disabled={!canSave} onClick={() => onSave(form)}>Opslaan</button>
        </div>
      </div>
    </div>
  );
}

  {
