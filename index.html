<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROVIL Verzuimtool 2025-2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* PROVIL Verzuimtool — styles */

:root {
  --bg: #f6f7f9;
  --bg-elevated: #ffffff;
  --bg-subtle: #f1f3f6;
  --bg-hover: #eef1f5;
  --border: #e3e6eb;
  --border-strong: #cdd2da;
  --text: #0f172a;
  --text-muted: #5b6472;
  --text-faint: #8a93a2;

  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-soft: #e6edfd;
  --primary-text: #ffffff;

  --niv1: #16a34a;
  --niv1-bg: #e7f6ec;
  --niv2: #d97706;
  --niv2-bg: #fef2dc;
  --niv3: #dc2626;
  --niv3-bg: #fde8e8;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12), 0 4px 8px rgba(15, 23, 42, 0.05);

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;

  --sidebar-w: 248px;
}

html[data-theme="dark"] {
  --bg: #0e1117;
  --bg-elevated: #161b22;
  --bg-subtle: #1c222b;
  --bg-hover: #232a35;
  --border: #262d38;
  --border-strong: #353d4b;
  --text: #e6e9ef;
  --text-muted: #9aa3b2;
  --text-faint: #6e7686;

  --primary: #3b82f6;
  --primary-hover: #60a5fa;
  --primary-soft: #1a2540;

  --niv1: #22c55e;
  --niv1-bg: #14301f;
  --niv2: #f59e0b;
  --niv2-bg: #3a2a0f;
  --niv3: #ef4444;
  --niv3-bg: #391818;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* ===== Layout ===== */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* ===== Sidebar ===== */

.sidebar {
  background: var(--bg-elevated);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-logo {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--primary), #4f8af5);
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.sidebar-title {
  font-weight: 600;
  font-size: 13.5px;
  line-height: 1.25;
}
.sidebar-subtitle {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.sidebar-nav {
  flex: 1;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-section-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 12px 12px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 13.5px;
  font-weight: 500;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: background .12s, color .12s;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active {
  background: var(--primary-soft);
  color: var(--primary);
}
.nav-item svg { flex-shrink: 0; }

.sidebar-footer {
  padding: 14px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.toggle-switch {
  width: 32px;
  height: 18px;
  background: var(--border-strong);
  border-radius: 999px;
  position: relative;
  border: none;
  transition: background .15s;
}
.toggle-switch.on { background: var(--primary); }
.toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  background: white;
  border-radius: 50%;
  transition: transform .15s;
}
.toggle-switch.on .toggle-knob { transform: translateX(14px); }
.user-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  font-size: 12.5px;
}
.user-chip .avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  display: grid;
  place-items: center;
  color: white;
  font-weight: 600;
  font-size: 12px;
}
.user-chip .name { font-weight: 600; }
.user-chip .role { color: var(--text-muted); font-size: 11px; }

/* ===== Main ===== */

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.topbar {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
}
.breadcrumb .crumb { color: var(--text-muted); }
.breadcrumb .crumb.current { color: var(--text); font-weight: 600; }
.breadcrumb .sep { color: var(--text-faint); }
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--text-muted);
}
.topbar-actions .schoolyear {
  padding: 6px 11px;
  background: var(--bg-subtle);
  border-radius: 6px;
  border: 1px solid var(--border);
  font-weight: 500;
}

.content {
  padding: 28px 32px 64px;
  max-width: 1400px;
  width: 100%;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 22px;
  gap: 16px;
  flex-wrap: wrap;
}
.page-title {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
}
.page-subtitle {
  color: var(--text-muted);
  font-size: 13.5px;
  margin: 0;
}

/* ===== Cards ===== */

.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: 20px; }
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}
.card-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin: 2px 0 0;
}

/* ===== Stats grid ===== */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.stat-card .stat-label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 6px;
}
.stat-card .stat-value {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.stat-card .stat-meta {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-card.accent-niv1 { border-left: 3px solid var(--niv1); }
.stat-card.accent-niv2 { border-left: 3px solid var(--niv2); }
.stat-card.accent-niv3 { border-left: 3px solid var(--niv3); }
.stat-card.accent-primary { border-left: 3px solid var(--primary); }
.stat-card.accent-niv1 .stat-value { color: var(--niv1); }
.stat-card.accent-niv2 .stat-value { color: var(--niv2); }
.stat-card.accent-niv3 .stat-value { color: var(--niv3); }

/* ===== Two column ===== */

.two-col {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 16px;
  margin-bottom: 22px;
}
@media (max-width: 1000px) {
  .two-col { grid-template-columns: 1fr; }
}

/* ===== Bar chart ===== */

.bar-chart { display: flex; flex-direction: column; gap: 14px; padding: 8px 0 4px; }
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-label {
  width: 110px;
  font-size: 12.5px;
  color: var(--text);
  font-weight: 500;
  flex-shrink: 0;
}
.bar-track {
  flex: 1;
  height: 22px;
  background: var(--bg-subtle);
  border-radius: 5px;
  display: flex;
  overflow: hidden;
  position: relative;
}
.bar-seg {
  height: 100%;
  transition: width .4s ease;
  display: grid;
  place-items: center;
  font-size: 10.5px;
  font-weight: 600;
  color: white;
}
.bar-seg.s1 { background: var(--niv1); }
.bar-seg.s2 { background: var(--niv2); }
.bar-seg.s3 { background: var(--niv3); }
.bar-total {
  width: 36px;
  text-align: right;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-muted);
}

.legend {
  display: flex;
  gap: 16px;
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--text-muted);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; }

/* ===== Activity list ===== */

.activity-list { display: flex; flex-direction: column; }
.activity-row {
  display: flex;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
}
.activity-row:last-child { border-bottom: none; }
.activity-row:hover { background: var(--bg-hover); }
.activity-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--bg-subtle);
  display: grid;
  place-items: center;
  color: var(--text-muted);
  flex-shrink: 0;
}
.activity-text { flex: 1; min-width: 0; }
.activity-title { font-size: 13px; font-weight: 500; }
.activity-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

/* ===== Filterbar ===== */

.filterbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  background: var(--bg-elevated);
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.search-input {
  flex: 1;
  min-width: 220px;
  position: relative;
}
.search-input input {
  width: 100%;
  padding: 9px 11px 9px 34px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  font-size: 13px;
  outline: none;
  transition: border-color .12s, box-shadow .12s;
}
.search-input input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.search-input svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
}
.dropdown {
  padding: 9px 11px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  outline: none;
  cursor: pointer;
  min-width: 140px;
  transition: border-color .12s;
}
.dropdown:hover, .dropdown:focus { border-color: var(--border-strong); }

/* Filter chips */
.filter-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 14px 18px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; }
.filter-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg);
  transition: all .15s; position: relative; white-space: nowrap;
}
.filter-chip:hover { border-color: var(--border-strong); background: var(--bg-elevated); }
.filter-chip.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); font-weight: 600; }
.filter-chip select {
  appearance: none; -webkit-appearance: none;
  background: none; border: none; outline: none;
  font: inherit; color: inherit; cursor: pointer;
  padding-right: 14px;
}
.filter-chip .chevron { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: .5; }
.filter-chip.active .chevron { opacity: .8; }
.filter-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
.filter-summary { font-size: 12px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
.filter-clear {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--niv3); background: #fee2e2; color: var(--niv3);
  transition: all .12s;
}
.filter-clear:hover { background: #fecaca; }

/* ===== Buttons ===== */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background .12s, border-color .12s, transform .04s;
}
.btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--primary);
  color: var(--primary-text);
  border-color: var(--primary);
}
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border-color: var(--primary);
}
.btn-outline:hover { background: var(--primary-soft); }
.btn-danger {
  background: var(--niv3);
  color: white;
  border-color: var(--niv3);
}
.btn-danger:hover { background: #b91c1c; border-color: #b91c1c; }
.btn-ghost {
  background: transparent;
  border-color: transparent;
}
.btn-ghost:hover { background: var(--bg-hover); }
.btn-sm { padding: 6px 10px; font-size: 12px; }

/* ===== Table ===== */

.table-wrap {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  box-shadow: var(--shadow-sm);
}
table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table thead {
  background: var(--bg-subtle);
}
.data-table th {
  text-align: left;
  font-weight: 600;
  font-size: 11.5px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.data-table th:hover { color: var(--text); }
.data-table th .sort-icon { opacity: 0.5; margin-left: 4px; }
.data-table th.sorted .sort-icon { opacity: 1; color: var(--primary); }
.data-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.data-table tbody tr {
  cursor: pointer;
  transition: background .1s;
}
.data-table tbody tr:hover { background: var(--bg-hover); }
.data-table tbody tr:last-child td { border-bottom: none; }

.data-table tr.row-niv3 { background: var(--niv3-bg); }
.data-table tr.row-niv2 { background: var(--niv2-bg); }
.data-table tr.row-niv3:hover, .data-table tr.row-niv2:hover { filter: brightness(0.97); }

html[data-theme="dark"] .data-table tr.row-niv3:hover,
html[data-theme="dark"] .data-table tr.row-niv2:hover { filter: brightness(1.2); }

.name-cell { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 10px; }
.name-cell .student-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primary-soft);
  color: var(--primary);
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: 11px;
  flex-shrink: 0;
}

/* ===== Badges ===== */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  background: var(--bg-subtle);
  color: var(--text-muted);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.badge-niv1 { background: var(--niv1-bg); color: var(--niv1); border-color: transparent; }
.badge-niv2 { background: var(--niv2-bg); color: var(--niv2); border-color: transparent; }
.badge-niv3 { background: var(--niv3-bg); color: var(--niv3); border-color: transparent; }
.badge-primary { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-lg { padding: 5px 12px; font-size: 12.5px; }

.num-cell { font-variant-numeric: tabular-nums; font-weight: 500; }
.num-cell.high { color: var(--niv3); font-weight: 700; }

.evo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
}
.evo-pos { background: var(--niv1-bg); color: var(--niv1); }
.evo-neg { background: var(--niv3-bg); color: var(--niv3); }
.evo-eq { background: var(--bg-subtle); color: var(--text-faint); }

/* ===== Pagination ===== */

.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--text-muted);
}
.pagination-controls { display: flex; gap: 4px; }
.page-btn {
  padding: 5px 10px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  border-radius: 6px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
}
.page-btn:hover { background: var(--bg-hover); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

/* ===== Empty state ===== */

.empty {
  padding: 60px 24px;
  text-align: center;
  color: var(--text-muted);
}
.empty-illustration {
  width: 80px;
  height: 80px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--bg-subtle);
  display: grid;
  place-items: center;
  color: var(--text-faint);
}
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-text { font-size: 13px; max-width: 320px; margin: 0 auto; }

/* ===== Detail page ===== */

.detail-header {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  box-shadow: var(--shadow-sm);
}
.detail-header-info { display: flex; gap: 16px; align-items: flex-start; }
.detail-avatar {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--primary-soft);
  color: var(--primary);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 20px;
  flex-shrink: 0;
}
.detail-name {
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}
.detail-badges {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.detail-actions { display: flex; gap: 8px; }
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  margin-bottom: 12px;
}
.back-link:hover { color: var(--text); }

.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
  overflow-x: auto;
}
.tab {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  position: relative;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  transition: color .12s;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.tab-count {
  background: var(--bg-subtle);
  color: var(--text-muted);
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  margin-left: 6px;
}
.tab.active .tab-count { background: var(--primary-soft); color: var(--primary); }

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 900px) {
  .detail-grid { grid-template-columns: 1fr; }
}

.field {
  margin-bottom: 14px;
}
.field-label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
  display: block;
}
.field-value { font-size: 14px; color: var(--text); }
.field-input, .field-textarea, .field-select {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  font-size: 13.5px;
  outline: none;
  transition: border-color .12s, box-shadow .12s;
}
.field-input:focus, .field-textarea:focus, .field-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.field-textarea { min-height: 90px; resize: vertical; font-family: inherit; }

/* Code stepper */
.code-stepper {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
  background: var(--bg-subtle);
  border-radius: var(--radius);
  margin-bottom: 12px;
}
.code-stepper .label { flex: 1; }
.code-stepper .code-name { font-weight: 600; font-size: 14px; }
.code-stepper .code-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.stepper-controls {
  display: flex;
  align-items: center;
  gap: 4px;
}
.step-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.step-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.step-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.step-value {
  min-width: 48px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.niv-explainer {
  display: flex;
  gap: 12px;
  padding: 14px;
  border-radius: var(--radius);
  margin-top: 12px;
  font-size: 12.5px;
  line-height: 1.5;
  align-items: flex-start;
}
.niv-explainer.niv1 { background: var(--niv1-bg); color: var(--niv1); }
.niv-explainer.niv2 { background: var(--niv2-bg); color: var(--niv2); }
.niv-explainer.niv3 { background: var(--niv3-bg); color: var(--niv3); }
.niv-explainer strong { font-weight: 700; }
.niv-explainer svg { flex-shrink: 0; margin-top: 1px; }

/* Checkbox list */
.check-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .1s;
}
.check-item:hover { background: var(--bg-hover); }
.check-item input[type="checkbox"] {
  margin: 1px 0 0;
  width: 16px;
  height: 16px;
  accent-color: var(--primary);
  cursor: pointer;
  flex-shrink: 0;
}
.check-item .check-label { font-size: 13.5px; flex: 1; }
.check-item.checked .check-label { font-weight: 500; }
.check-item .check-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.check-item .check-note {
  margin-top: 8px;
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  font-size: 12.5px;
  font-family: inherit;
  resize: vertical;
  min-height: 36px;
}

.section-block { margin-bottom: 24px; }
.section-block h4 {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin: 0 0 10px;
}

/* Radio group */
.radio-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.radio-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  border-radius: 999px;
  font-size: 13px;
  cursor: pointer;
  transition: all .12s;
}
.radio-pill:hover { border-color: var(--border-strong); }
.radio-pill.selected {
  background: var(--primary-soft);
  color: var(--primary);
  border-color: var(--primary);
  font-weight: 600;
}
.radio-pill.selected.fase-in-opstart { background: #fef3c7; color: #b45309; border-color: #f59e0b; }
.radio-pill.selected.fase-in-opstart .dot { border-color: #f59e0b; background: #f59e0b; }
.radio-pill.selected.fase-lopende { background: #dbeafe; color: #1d4ed8; border-color: #3b82f6; }
.radio-pill.selected.fase-lopende .dot { border-color: #3b82f6; background: #3b82f6; }
.radio-pill.selected.fase-moeizaam { background: #fee2e2; color: #b91c1c; border-color: #ef4444; }
.radio-pill.selected.fase-moeizaam .dot { border-color: #ef4444; background: #ef4444; }
.radio-pill.selected.fase-afgerond { background: #dcfce7; color: #15803d; border-color: #22c55e; }
.radio-pill.selected.fase-afgerond .dot { border-color: #22c55e; background: #22c55e; }
.fase-pill-compact { padding: 5px 10px; font-size: 12px; gap: 5px; }
.fase-pill-compact .dot { width: 8px; height: 8px; }
.fase-chip-in-opstart { background: #fef3c7 !important; color: #b45309 !important; border-color: #f59e0b !important; }
.fase-chip-in-opstart select { color: #b45309; }
.fase-chip-lopende { background: #dbeafe !important; color: #1d4ed8 !important; border-color: #3b82f6 !important; }
.fase-chip-lopende select { color: #1d4ed8; }
.fase-chip-moeizaam { background: #fee2e2 !important; color: #b91c1c !important; border-color: #ef4444 !important; }
.fase-chip-moeizaam select { color: #b91c1c; }
.fase-chip-afgerond { background: #dcfce7 !important; color: #15803d !important; border-color: #22c55e !important; }
.fase-chip-afgerond select { color: #15803d; }
.fase-chip-none { background: var(--bg) !important; color: var(--text-muted) !important; border-color: var(--border) !important; }
.radio-pill .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  flex-shrink: 0;
}
.radio-pill.selected .dot {
  border-color: var(--primary);
  background: var(--primary);
  box-shadow: inset 0 0 0 2px white;
}

/* Timeline */
.timeline {
  position: relative;
  padding-left: 24px;
}
.timeline::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 18px; }
.timeline-item::before {
  content: "";
  position: absolute;
  left: -22px;
  top: 5px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--bg-elevated);
  border: 2px solid var(--primary);
}
.timeline-date { font-size: 11.5px; color: var(--text-muted); font-weight: 500; }
.timeline-title { font-size: 13.5px; font-weight: 600; margin: 2px 0; }
.timeline-detail { font-size: 12.5px; color: var(--text-muted); }

/* Notes */
.note-item {
  padding: 14px;
  background: var(--bg-subtle);
  border-radius: var(--radius);
  margin-bottom: 10px;
  position: relative;
}
.note-meta {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.note-text { font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
.note-delete {
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
}
.note-delete:hover { color: var(--niv3); }

/* Toast */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-left: 3px solid var(--niv1);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 240px;
  animation: slideIn 0.25s ease;
}
.toast.error { border-left-color: var(--niv3); }
@keyframes slideIn {
  from { transform: translateX(20px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(2px);
  z-index: 999;
  display: grid;
  place-items: center;
  padding: 20px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.2s ease;
}
@keyframes slideUp {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-large { max-width: 640px; }
.modal-title { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
.modal-text { color: var(--text-muted); font-size: 13.5px; margin: 0 0 20px; }
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
}
.modal-form { display: flex; flex-direction: column; gap: 14px; }

/* Settings table */
.settings-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.settings-table th, .settings-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}
.settings-table th {
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
  background: var(--bg-subtle);
  letter-spacing: 0.04em;
}
.settings-table td:first-child { font-weight: 600; }
.threshold-input {
  width: 60px;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg);
  font-size: 13px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.threshold-input:focus { border-color: var(--primary); outline: none; }
.threshold-cell { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--text-muted); }

/* Quick chips */
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border-radius: 999px;
  background: var(--bg-subtle);
  font-size: 12px;
  color: var(--text);
  border: 1px solid var(--border);
}

/* Utility */
.row { display: flex; align-items: center; gap: 8px; }
.spacer { flex: 1; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.mb-0 { margin-bottom: 0 !important; }
.mb-2 { margin-bottom: 12px; }
.mb-3 { margin-bottom: 18px; }
.mt-2 { margin-top: 12px; }

.divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0;
}

.scroll-x { overflow-x: auto; }

/* Excel-stijl CLB tabel */
.excel-table { font-size: 13px; }
.excel-table th { background: var(--bg-subtle); position: sticky; top: 0; z-index: 2; }
.excel-row td { padding: 8px 12px; border-right: 1px solid var(--border); }
.excel-row td:last-child { border-right: none; }
.code-cell {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 2px;
}
.code-btn {
  width: 24px; height: 24px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 15px;
  font-weight: 700;
  border-radius: 5px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background .1s;
}
.code-btn:hover { background: var(--bg-hover); color: var(--primary); }
.code-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.code-num {
  min-width: 28px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}
.code-num.high { color: var(--niv3); font-weight: 700; }

.cell-pill {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12.5px;
  cursor: pointer;
  font-family: inherit;
  color: var(--text);
  transition: background .1s, border-color .1s;
}
.cell-pill:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

.evo-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
}

.excel-foot td {
  background: var(--bg-subtle);
  padding: 10px 12px;
  font-size: 12.5px;
  border-top: 2px solid var(--border-strong);
}

/* Action row on detail header for niveau pill */
.niv-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  margin-top: 8px;
}
.niv-pill.niv1 { background: var(--niv1-bg); color: var(--niv1); }
.niv-pill.niv2 { background: var(--niv2-bg); color: var(--niv2); }
.niv-pill.niv3 { background: var(--niv3-bg); color: var(--niv3); }

/* ===== Mobile hamburger ===== */
.mobile-header {
  display: none;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.mobile-header .sidebar-logo { width: 32px; height: 32px; font-size: 12px; border-radius: 7px; }
.hamburger {
  width: 36px; height: 36px;
  background: none; border: 1px solid var(--border);
  border-radius: 8px; display: grid; place-items: center;
  color: var(--text); cursor: pointer;
}
.hamburger:hover { background: var(--bg-hover); }
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15,23,42,0.4);
  backdrop-filter: blur(2px);
  z-index: 200;
}
.sidebar-overlay.open { display: block; }

/* ===== Mobile responsive ===== */
@media (max-width: 768px) {
  .mobile-header { display: flex; }
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: -280px; top: 0; bottom: 0;
    width: 268px; z-index: 300;
    transition: left .25s ease;
    box-shadow: none;
  }
  .sidebar.open { left: 0; box-shadow: var(--shadow-lg); }
  .topbar { display: none; }
  .content { padding: 18px 14px 48px; }
  .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .page-title { font-size: 20px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 14px; }
  .stat-card .stat-value { font-size: 22px; }
  .two-col { grid-template-columns: 1fr; }
  .filterbar { flex-direction: column; gap: 8px; }
  .search-input { min-width: 100%; }
  .dropdown { min-width: 100%; }
  .detail-header { flex-direction: column; padding: 16px; align-items: center; text-align: center; }
  .detail-header-info { flex-direction: column; align-items: center; text-align: center; }
  .detail-badges { justify-content: center; }
  .detail-actions { justify-content: center; width: 100%; }
  .detail-avatar { width: 48px; height: 48px; font-size: 18px; border-radius: 12px; }
  .detail-name { font-size: 18px; }
  .print-header { display: none; }
  .detail-grid { grid-template-columns: 1fr; }
  .tabs { gap: 0; }
  .tab { padding: 9px 10px; font-size: 12px; }
  .tab-count { font-size: 9.5px; padding: 1px 5px; margin-left: 3px; }
  .code-stepper { flex-direction: column; gap: 8px; text-align: center; align-items: stretch; }
  .stepper-controls { justify-content: center; }
  .chip-row { flex-wrap: wrap; }
  .pagination { flex-direction: column; gap: 10px; text-align: center; }
  .modal { margin: 12px; padding: 18px; max-width: 100%; }
  .modal-large { max-width: 100%; }
  .bar-label { width: 70px; font-size: 11px; }
  .radio-group { flex-direction: column; }
  .radio-pill { justify-content: center; }
  .settings-table { font-size: 11.5px; }
  .threshold-input { width: 46px; font-size: 12px; padding: 4px 4px; }
  .threshold-cell { gap: 2px; font-size: 11px; }
  .excel-row td { padding: 6px 8px; font-size: 12px; }
  .name-cell { font-size: 12.5px; gap: 6px; }
  .name-cell .student-avatar { width: 24px; height: 24px; font-size: 10px; }
  .niv-explainer { flex-direction: column; text-align: center; }
  .user-chip .name { font-size: 12px; }
  .activity-row { padding: 10px 14px; }
  .toast { min-width: 200px; font-size: 12px; }
  .toast-container { bottom: 12px; right: 12px; left: 12px; }
  .table-wrap { border-radius: var(--radius); }
  .scroll-x { -webkit-overflow-scrolling: touch; }
  .scroll-x > table.data-table { min-width: 700px; }
  .tabs { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
}

@media (max-width: 420px) {
  .stats-grid { grid-template-columns: 1fr; }
  .stat-card .stat-value { font-size: 20px; }
  .badge-lg { padding: 3px 8px; font-size: 11px; }
  .btn { padding: 8px 10px; font-size: 12px; }
  .btn-sm { padding: 5px 8px; font-size: 11px; }
  .tab { padding: 8px 7px; font-size: 11px; }
}

/* ===== Print ===== */
@media print {
  body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sidebar, .sidebar-overlay, .mobile-header, .topbar, .hamburger,
  .detail-actions, .btn, .filter-bar, .filter-chip, .search-input,
  .tabs, .back-link, .toast-container, .no-print,
  .detail-header, .print-header, .pdf-overlay { display: none !important; }
  .app { display: block !important; }
  .main { margin: 0 !important; padding: 0 !important; }
  .content { padding: 0 !important; max-width: none !important; }
  .card { box-shadow: none !important; border: 1px solid #ddd !important; break-inside: avoid; }
  .print-only { display: block !important; }
  a { color: inherit !important; text-decoration: none !important; }
  h4 { page-break-after: avoid; }
  /* Summary page */
  .print-summary { page-break-after: always; }
  .print-summary .ps-header { text-align: center; border-bottom: 2px solid #1d4ed8; padding-bottom: 10px; margin-bottom: 14px; }
  .print-summary .ps-header h2 { margin: 0 0 2px; font-size: 20px; color: #1d4ed8; }
  .print-summary .ps-header p { margin: 0; font-size: 11px; color: #666; }

// CSV export
function studentsToCSV(students) {
  const headers = ['Naam', 'Klas', 'Onderwijsvorm', 'B-codes', 'D-codes', 'CLB-type', 'CLB-naam', 'Fase', 'Evolutie traject', 'Evolutie afwezigheden', 'Hypothese', 'Datum registratie', 'Laatste update'];
  const rows = students.map(s => [s.naam, s.klas, s.onderwijsvorm, s.bcodes, s.dcodes, s.clbType, s.clbNaam, s.fase, s.evolutieTraject, s.evolutie, s.hypothese, s.datumRegistratie, s.laatsteUpdate]);
  const esc = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [headers, ...rows].map(r => r.map(esc).join(',')).join('\n');
}

function download(filename, content, type = 'text/plain') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

// Toast context
const ToastCtx = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = React.useState([]);
  const show = React.useCallback((text, kind = 'success') => {
    const id = uid();
    setToasts(ts => [...ts, { id, text, kind }]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 2400);
  }, []);
  return (
    <ToastCtx.Provider value={show}>
      {children}
      <div className="toast-container">
        {toasts.map(t => (
          <div key={t.id} className={'toast ' + (t.kind === 'error' ? 'error' : '')}>
            <Icon name={t.kind === 'error' ? 'x' : 'check'} size={16} style={{ color: t.kind === 'error' ? 'var(--niv3)' : 'var(--niv1)' }} />
            {t.text}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

function useToast() { return React.useContext(ToastCtx); }

// Stamp 'door' (author) onto any tijdlijn entries that don't have it.
// Used when updating/creating students.
function stampAuthor(next, prev, user) {
  if (!next || !next.tijdlijn) return next;
  const prevLen = prev?.tijdlijn?.length || 0;
  const userName = user?.naam || 'Systeem';
  const userRole = user?.rol || '';
  const stamped = next.tijdlijn.map((entry, i) => {
    // Only stamp entries that are new (added in front) and don't already have author
    if (entry.door) return entry;
    if (i < next.tijdlijn.length - prevLen) {
      return { ...entry, door: userName, rol: userRole };
    }
    return entry;
  });
  return { ...next, tijdlijn: stamped };
}

  );
}

// students.jsx — leerlingen overview

function Students({ state, onOpenStudent, onCreate, can }) {
  const { students, thresholds } = state;
  const [query, setQuery] = React.useState('');
  const [fOnderwijs, setFOnderwijs] = React.useState('');
  const [fNiveau, setFNiveau] = React.useState('');
  const [fClb, setFClb] = React.useState('');
  const [fFase, setFFase] = React.useState('');
  const [sortKey, setSortKey] = React.useState('laatsteUpdate');
  const [sortDir, setSortDir] = React.useState('desc');
  const [page, setPage] = React.useState(1);
  const pageSize = 10;

  const withNiv = students.map(s => ({ ...s, niveau: calcNiveau(s.bcodes, s.dcodes, thresholds, s.onderwijsvorm) }));

  const filtered = withNiv.filter(s => {
    if (query) {
      const q = query.toLowerCase();
      if (!s.naam.toLowerCase().includes(q) && !s.klas.toLowerCase().includes(q)) return false;
    }
    if (fOnderwijs && s.onderwijsvorm !== fOnderwijs) return false;
    if (fNiveau && String(s.niveau) !== fNiveau) return false;
    if (fClb && s.clbType !== fClb) return false;
    if (fFase && s.fase !== fFase) return false;
    return true;
  });

  const sorted = [...filtered].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av == null) av = '';
    if (bv == null) bv = '';
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
  const pageData = sorted.slice((page - 1) * pageSize, page * pageSize);

  React.useEffect(() => { if (page > totalPages) setPage(1); }, [totalPages]);

  function toggleSort(key) {
    if (sortKey === key) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  }

  function SortHead({ k, children }) {
    const active = sortKey === k;
    return (
      <th className={active ? 'sorted' : ''} onClick={() => toggleSort(k)}>
        {children}
        <span className="sort-icon">{active ? (sortDir === 'asc' ? '▲' : '▼') : '⇅'}</span>
      </th>
    );
  }

  const activeFilterCount = [fOnderwijs, fNiveau, fClb, fFase].filter(Boolean).length;

  return (
    <div>
      <div className="page-header">
        <div>
          <h1 className="page-title">Leerlingen</h1>
          <p className="page-subtitle">{filtered.length} van {students.length} leerlingen{activeFilterCount > 0 && ` · ${activeFilterCount} filter${activeFilterCount > 1 ? 's' : ''} actief`}</p>
        </div>
        {can('leerling_aanmaken') && (
          <button className="btn btn-primary" onClick={onCreate}>
            <Icon name="plus" size={15} /> Nieuwe leerling
          </button>
        )}
      </div>

      {/* Search row */}
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 10 }}>
        <div className="search-input" style={{ flex: 1, maxWidth: 380 }}>
          <Icon name="search" size={15} />
          <input type="text" placeholder="Zoek op naam of klas…" value={query} onChange={e => { setQuery(e.target.value); setPage(1); }}/>
        </div>
        <span className="filter-summary">
          <strong>{filtered.length}</strong> van {students.length} leerlingen{activeFilterCount > 0 && ` · ${activeFilterCount} filter${activeFilterCount > 1 ? 's' : ''} actief`}
        </span>
      </div>

      {/* Filter chips */}
      <div className="filter-bar" style={{ marginBottom: 16 }}>
        <Icon name="filter" size={14} style={{ color: 'var(--text-muted)', flexShrink: 0 }}/>
        <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', marginRight: 2 }}>Filters</span>
        <div className="filter-sep"></div>

        <label className={'filter-chip' + (fOnderwijs ? ' active' : '')}>
          <select value={fOnderwijs} onChange={e => { setFOnderwijs(e.target.value); setPage(1); }}>
            <option value="">Onderwijsvorm</option>
            {ONDERWIJSVORMEN.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fNiveau ? ' active' : '')}>
          <select value={fNiveau} onChange={e => { setFNiveau(e.target.value); setPage(1); }}>
            <option value="">Niveau</option>
            <option value="3">N3 — Hoog</option>
            <option value="2">N2 — Midden</option>
            <option value="1">N1 — Laag</option>
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fClb ? ' active' : '')}>
          <select value={fClb} onChange={e => { setFClb(e.target.value); setPage(1); }}>
            <option value="">CLB-status</option>
            <option value="Consult">Consult</option>
            <option value="Traject">Traject</option>
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        <label className={'filter-chip' + (fFase ? ' active' : '')}>
          <select value={fFase} onChange={e => { setFFase(e.target.value); setPage(1); }}>
            <option value="">Fase</option>
            {FASES.map(f => <option key={f} value={f}>{f}</option>)}
          </select>
          <span className="chevron"><Icon name="chevDown" size={10}/></span>
        </label>

        {activeFilterCount > 0 && (
          <React.Fragment>
            <div className="filter-sep"></div>
            <button className="filter-clear" onClick={() => { setQuery(''); setFOnderwijs(''); setFNiveau(''); setFClb(''); setFFase(''); setPage(1); }}>
              <Icon name="x" size={11}/> Wis alles
            </button>
          </React.Fragment>
        )}
      </div>

      <div className="table-wrap">
        <div className="scroll-x">
          <table className="data-table">
            <thead>
              <tr>
                <SortHead k="naam">Naam</SortHead>
                <SortHead k="klas">Klas</SortHead>
                <SortHead k="onderwijsvorm">Onderwijsvorm</SortHead>
                <SortHead k="bcodes">B-codes</SortHead>
                <SortHead k="dcodes">D-codes</SortHead>
                <SortHead k="niveau">Inschaling</SortHead>
                <SortHead k="clbType">CLB</SortHead>
                <SortHead k="fase">Fase</SortHead>
                <SortHead k="evolutie">Evolutie</SortHead>
                <SortHead k="laatsteUpdate">Laatste update</SortHead>
              </tr>
            </thead>
            <tbody>
              {pageData.length === 0 && (
                <tr>
                  <td colSpan={10}>
                    <div className="empty">
                      <div className="empty-illustration"><Icon name="users" size={32}/></div>
                      <div className="empty-title">{students.length === 0 ? 'Nog geen leerlingen toegevoegd' : 'Geen resultaten'}</div>
                      <div className="empty-text">{students.length === 0 ? 'Klik op + Nieuwe leerling om te beginnen.' : 'Pas je filters aan om meer leerlingen te zien.'}</div>
                    </div>
                  </td>
                </tr>
              )}
              {pageData.map(s => {
                const t = thresholds[s.onderwijsvorm] || defaultThresholds()[s.onderwijsvorm];
                const bHigh = s.bcodes >= t.niv3.b;
                return (
                  <tr key={s.id} onClick={() => onOpenStudent(s.id)}>
                    <td>
                      <div className="name-cell">
                        <div className="student-avatar">{initials(s.naam)}</div>
                        {s.naam}
                      </div>
                    </td>
                    <td>{s.klas}</td>
                    <td><span className="badge">{s.onderwijsvorm}</span></td>
                    <td><span className={'num-cell' + (bHigh ? ' high' : '')}>{s.bcodes}</span></td>
                    <td><span className="num-cell">{s.dcodes}</span></td>
                    <td>
                      <span className={'badge ' + nivClass(s.niveau)}>
                        <span className="badge-dot"></span> Niveau {s.niveau}
                      </span>
                    </td>
                    <td>{s.clbType ? <span className="badge badge-primary">{s.clbType}</span> : <span className="muted">—</span>}</td>
                    <td>{s.fase || <span className="muted">—</span>}</td>
                    <td>
                      {s.evolutie === 'Positief' && <span className="evo evo-pos" title="Positief"><Icon name="arrowUp" size={14}/></span>}
                      {s.evolutie === 'Negatief' && <span className="evo evo-neg" title="Negatief"><Icon name="arrowDown" size={14}/></span>}
                      {(s.evolutie === 'Status quo' || !s.evolutie) && <span className="evo evo-eq" title="Status quo"><Icon name="horizontal" size={14}/></span>}
                    </td>
                    <td><span className="muted">{fmtDate(s.laatsteUpdate)}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {sorted.length > 0 && (
          <div className="pagination">
            <div>Pagina {page} van {totalPages} · {sorted.length} resultaten</div>
            <div className="pagination-controls">
              <button className="page-btn" disabled={page === 1} onClick={() => setPage(p => Math.max(1, p - 1))}>
                <Icon name="chevLeft" size={13}/>
              </button>
              {Array.from({ length: totalPages }, (_, i) => i + 1).slice(0, 7).map(p => (
                <button key={p} className={'page-btn' + (page === p ? ' active' : '')} onClick={() => setPage(p)}>{p}</button>
              ))}
              <button className="page-btn" disabled={page === totalPages} onClick={() => setPage(p => Math.min(totalPages, p + 1))}>
                <Icon name="chevRight" size={13}/>
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

        </div>

  );

// student-detail.jsx — full student dossier with tabs

function StudentDetail({ student, state, onUpdate, onBack, onDelete, can }) {
  const [tab, setTab] = React.useState('overzicht');
  const [editing, setEditing] = React.useState(false);
  const [showPdf, setShowPdf] = React.useState(false);
  const toast = useToast();
  const niveau = calcNiveau(student.bcodes, student.dcodes, state.thresholds, student.onderwijsvorm);

  function patch(changes, logEntry) {
    const next = { ...student, ...changes, laatsteUpdate: todayISO() };
    if (logEntry) {
      next.tijdlijn = [{ datum: todayISO(), ...logEntry }, ...(student.tijdlijn || [])];
    }
    onUpdate(next);
  }

  return (
    <div>
      <button className="back-link" onClick={onBack}>
        <Icon name="chevLeft" size={14}/> Terug naar leerlingen
      </button>

      <div className="detail-header">
        <div className="detail-header-info">
          <div className="detail-avatar">{initials(student.naam)}</div>
          <div>
            <h1 className="detail-name">{student.naam}</h1>
            <div className="detail-badges">
              <span className="badge badge-lg">Klas {student.klas}</span>
              <span className="badge badge-lg">{student.onderwijsvorm}</span>
              {student.clbType && <span className="badge badge-lg badge-primary">CLB {student.clbType}</span>}
            </div>
            <div className={'niv-pill ' + nivExplainerClass(niveau)}>
              <span className="badge-dot"></span> Inschaling — Niveau {niveau}
            </div>
          </div>
        </div>
        <div className="detail-actions">
          {can('leerling_bewerken') && (
            <button className={'btn ' + (editing ? 'btn-primary' : 'btn-outline')} onClick={() => { setEditing(!editing); if (editing) toast('Wijzigingen opgeslagen'); else toast('Bewerkingsmodus actief — pas velden aan'); }}>
              <Icon name={editing ? 'check' : 'edit'} size={14}/> {editing ? 'Opslaan' : 'Bewerken'}
            </button>
          )}
          {can('leerling_verwijderen') && (
            <button className="btn" onClick={onDelete} title="Dossier verwijderen">
              <Icon name="trash" size={14}/>
            </button>
          )}
          {can('export_data') && (
            <button className="btn" onClick={() => setShowPdf(true)} title="PDF preview">
              <Icon name="download" size={14}/> PDF
            </button>
          )}
        </div>
      </div>
      <div className="print-header">
        <h2>PROVIL Verzuimdossier — {student.naam}</h2>
        <p>Klas {student.klas} · {student.onderwijsvorm} · Niveau {niveau} · {student.clbType ? 'CLB ' + student.clbType : 'Geen CLB'} · Afgedrukt op {fmtDate(todayISO())}</p>
      </div>

      <div className="tabs">
        {[
          { id: 'overzicht', label: 'Overzicht' },
          { id: 'acties', label: 'Acties & Afspraken' },
          { id: 'clb', label: 'CLB-opvolging' },
          { id: 'extern', label: 'Externe diensten', count: Object.values(student.diensten || {}).filter(d => d.active).length },
          { id: 'contact', label: 'Contactlog', count: (student.contactLog || []).length },
          { id: 'stats', label: 'Statistieken' },
          { id: 'tijdlijn', label: 'Tijdlijn', count: (student.tijdlijn || []).length },
          { id: 'opmerkingen', label: 'Opmerkingen', count: (student.notities || []).length },
        ].map(t => (
          <button key={t.id} className={'tab' + (tab === t.id ? ' active' : '')} onClick={() => setTab(t.id)}>
            {t.label}
            {t.count !== undefined && t.count > 0 && <span className="tab-count">{t.count}</span>}
          </button>
        ))}
      </div>

      {/* Active tab (screen) */}
      <div className="no-print">
        {tab === 'overzicht' && <TabOverzicht student={student} state={state} editing={editing && can('leerling_bewerken')} patch={patch}/>}
        {tab === 'acties' && <TabActies student={student} editing={editing && can('leerling_bewerken')} patch={patch}/>}
        {tab === 'clb' && <TabCLB student={student} editing={editing && can('clb_beheren')} patch={patch}/>}
        {tab === 'extern' && <TabExtern student={student} editing={editing} patch={patch} can={can}/>}
        {tab === 'contact' && <TabContact student={student} patch={patch} can={can}/>}
        {tab === 'stats' && <TabStats student={student} state={state}/>}
        {tab === 'tijdlijn' && <TabTijdlijn student={student}/>}
        {tab === 'opmerkingen' && <TabOpmerkingen student={student} patch={patch}/>}
      </div>

      {/* ====== PDF / Print (hidden, used by @media print) ====== */}
      <PrintDossier student={student} state={state}/>

      {/* ====== PDF Preview Overlay ====== */}
      {showPdf && (
        <div className="pdf-overlay" onClick={e => { if (e.target === e.currentTarget) setShowPdf(false); }}>
          <div className="pdf-preview-container">
            <div className="pdf-preview-toolbar">
              <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700 }}>PDF Preview — {student.naam}</h3>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="btn btn-primary" onClick={() => { window.print(); }}>
                  <Icon name="download" size={14}/> Afdrukken / Download PDF
                </button>
                <button className="btn" onClick={() => setShowPdf(false)}>Sluiten</button>
              </div>
            </div>
            <div className="pdf-preview-pages">
              <div className="pdf-page">
                <PrintDossierPage1 student={student} state={state}/>
              </div>
              {(student.contactLog || []).length > 0 && (
                <div className="pdf-page">
                  <PrintDossierContacts student={student}/>
                </div>
              )}
              {(student.notities || []).length > 0 && (
                <div className="pdf-page">
                  <PrintDossierNotes student={student}/>
                </div>
              )}
              <div className="pdf-page">
                <PrintDossierTimeline student={student}/>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

          <div className="ps-row"><span>Niveau 2</span><span>B≥{t.niv2.b} of D≥{t.niv2.d}</span></div>
          <div className="ps-row"><span>Niveau 3</span><span>B≥{t.niv3.b} of D≥{t.niv3.d}</span></div>
        </div>
      </div>
      {student.hypothese && (
        <div className="ps-grid">
          <div className="ps-box ps-full">

    </div>
  );
}

function TabOverzicht({ student, state, editing, patch }) {
  const niveau = calcNiveau(student.bcodes, student.dcodes, state.thresholds, student.onderwijsvorm);
  const t = state.thresholds[student.onderwijsvorm] || defaultThresholds()[student.onderwijsvorm];
  const [editB, setEditB] = React.useState(String(student.bcodes));
  const [editD, setEditD] = React.useState(String(student.dcodes));
  React.useEffect(() => { setEditB(String(student.bcodes)); setEditD(String(student.dcodes)); }, [student.bcodes, student.dcodes]);

  const explainer = (() => {
    if (niveau === 3) return <>Dossier valt op <strong>Niveau 3</strong> omdat <strong>{student.bcodes} B-codes</strong> ≥ {t.niv3.b} of <strong>{student.dcodes} D-codes</strong> ≥ {t.niv3.d}. Dringende multidisciplinaire opvolging aangewezen.</>;
    if (niveau === 2) return <>Dossier valt op <strong>Niveau 2</strong> omdat het aantal codes hoger ligt dan de niveau-1 drempels ({t.niv1.b} B / {t.niv1.d} D). Verhoogde alertheid en CLB-consult aanbevolen.</>;
    return <>Dossier valt op <strong>Niveau 1</strong>: codes binnen de standaarddrempels ({t.niv1.b} B / {t.niv1.d} D). Preventieve opvolging volstaat.</>;
  })();

  function commitCode(field, raw) {
    const v = Math.max(0, parseInt(raw || '0', 10));
    const prev = student[field];
    if (v !== prev) {
      patch({ [field]: v }, { type: field === 'bcodes' ? 'B-codes bijgewerkt' : 'D-codes bijgewerkt', detail: `${field === 'bcodes' ? 'B' : 'D'}-codes: ${prev} → ${v}` });
    }
  }

  return (
    <div className="detail-grid">
      <div className="card card-pad">
        <h3 className="card-title mb-3">Basisgegevens</h3>
        <div className="field">
          <label className="field-label">Naam leerling</label>
          {editing ? (
            <input className="field-input" value={student.naam} onChange={e => patch({ naam: e.target.value })}/>
          ) : <div className="field-value">{student.naam}</div>}
        </div>
        <div className="field">
          <label className="field-label">Klas</label>
          {editing ? (
            <input className="field-input" value={student.klas} onChange={e => patch({ klas: e.target.value })}/>
          ) : <div className="field-value">{student.klas}</div>}
        </div>
        <div className="field">
          <label className="field-label">Onderwijsvorm</label>
          {editing ? (
            <select className="field-select" value={student.onderwijsvorm} onChange={e => patch({ onderwijsvorm: e.target.value })}>
              {ONDERWIJSVORMEN.map(o => <option key={o} value={o}>{o}</option>)}
            </select>
          ) : <div className="field-value"><span className="badge">{student.onderwijsvorm}</span></div>}
        </div>
        <div className="field mb-0">
          <label className="field-label">Datum registratie</label>
          <div className="field-value">{fmtDate(student.datumRegistratie)}</div>
        </div>
      </div>

      <div className="card card-pad">
        <h3 className="card-title mb-3">Verzuim-codes</h3>
        <p className="muted" style={{ fontSize: 12, margin: '0 0 12px' }}>Vul het nieuwe totaal in. Bij bevestiging wordt 1 lijn in de tijdlijn gelogd.</p>
        <div className="code-stepper">
          <div className="label">
            <div className="code-name">B-codes</div>
            <div className="code-desc">Problematische afwezigheid</div>
          </div>
          <div className="stepper-controls">
            <input
              type="number" min="0" className="field-input"
              style={{ width: 80, textAlign: 'center', fontSize: 20, fontWeight: 700, padding: '6px 8px', fontVariantNumeric: 'tabular-nums' }}
              value={editB}
              onChange={e => setEditB(e.target.value)}
              onBlur={() => commitCode('bcodes', editB)}
              onKeyDown={e => { if (e.key === 'Enter') { e.target.blur(); } }}
            />
          </div>
        </div>
        <div className="code-stepper">
          <div className="label">
            <div className="code-name">D-codes</div>
            <div className="code-desc">Te laat op school</div>
          </div>
          <div className="stepper-controls">
            <input
              type="number" min="0" className="field-input"
              style={{ width: 80, textAlign: 'center', fontSize: 20, fontWeight: 700, padding: '6px 8px', fontVariantNumeric: 'tabular-nums' }}
              value={editD}
              onChange={e => setEditD(e.target.value)}
              onBlur={() => commitCode('dcodes', editD)}
              onKeyDown={e => { if (e.key === 'Enter') { e.target.blur(); } }}
            />
          </div>
        </div>
        <div className={'niv-explainer ' + nivExplainerClass(niveau)}>
          <Icon name="info" size={16}/>
          <div>{explainer}</div>
        </div>
      </div>
    </div>
  );
}

function CheckList({ items, value = {}, onChange, disabled }) {
  return (
    <div className="check-list">
      {items.map(name => {
        const checked = !!value[name];
        return (
          <label key={name} className={'check-item' + (checked ? ' checked' : '')}>
            <input type="checkbox" checked={checked} disabled={disabled} onChange={e => onChange({ ...value, [name]: e.target.checked })}/>
            <span className="check-label">{name}</span>
          </label>
        );
      })}
    </div>
  );
}

function TabActies({ student, editing, patch }) {
  const prevActiesRef = React.useRef(student.schoolActies);
  const prevAfsprakenRef = React.useRef(student.afsprakenConsult);

  function onSchoolActieChange(v) {
    // Find which action changed and log it to timeline
    const prev = prevActiesRef.current || {};
    const changed = SCHOOL_ACTIES.find(a => !!v[a] !== !!prev[a]);
    const detail = changed ? (v[changed] ? changed : `${changed} (ongedaan)`) : '';
    prevActiesRef.current = v;
    patch({ schoolActies: v }, { type: 'Schoolactie', detail });
  }

  function onAfsprakenBlur(newVal) {
    const prev = prevAfsprakenRef.current || '';
    if (newVal !== prev && newVal.trim()) {
      prevAfsprakenRef.current = newVal;
      patch({ afsprakenConsult: newVal }, { type: 'Afspraak op consult bijgewerkt', detail: newVal.slice(0, 80) + (newVal.length > 80 ? '…' : '') });
    }
  }

  return (
    <div>
      <div className="card card-pad section-block">
        <h4>Schoolacties</h4>
        <p className="muted" style={{ fontSize: 11.5, margin: '-6px 0 8px' }}>Elke wijziging wordt gelogd in de tijdlijn.</p>
        <CheckList
          items={SCHOOL_ACTIES}
          value={student.schoolActies}
          disabled={!editing}
          onChange={onSchoolActieChange}
        />
      </div>

      <div className="card card-pad section-block">
        <h4 style={{ marginTop: 0 }}>Mogelijke hypothese</h4>
        <p className="muted" style={{ fontSize: 11.5, margin: '-6px 0 8px' }}>Wat zou onder de afwezigheden kunnen liggen?</p>
        {editing ? (
          <textarea className="field-textarea" value={student.hypothese || ''} onChange={e => patch({ hypothese: e.target.value })} placeholder="Bv. thuissituatie, motivatieproblemen, pesten, psychische klachten, vervoersproblemen…"/>
        ) : (
          <div className="field-value" style={{ whiteSpace: 'pre-wrap' }}>{student.hypothese || <span className="muted">Nog niets ingevuld.</span>}</div>
        )}
      </div>

      <div className="detail-grid">
        <div className="card card-pad">
          <h4 style={{ marginTop: 0, fontSize: 13, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--text-muted)' }}>Gemaakte afspraken op consult</h4>
          <p className="muted" style={{ fontSize: 11.5, margin: '-6px 0 8px' }}>Wordt gelogd in de tijdlijn bij opslaan.</p>
          {editing ? (
            <textarea className="field-textarea" value={student.afsprakenConsult || ''} onChange={e => patch({ afsprakenConsult: e.target.value })} onBlur={e => onAfsprakenBlur(e.target.value)} placeholder="Beschrijf welke afspraken er gemaakt zijn…"/>
          ) : (
            <div className="field-value" style={{ whiteSpace: 'pre-wrap' }}>{student.afsprakenConsult || <span className="muted">Nog niets ingevuld.</span>}</div>
          )}
        </div>
        <div className="card card-pad">
          <h4 style={{ marginTop: 0, fontSize: 13, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--text-muted)' }}>Doel gemaakte afspraken</h4>
          {editing ? (
            <textarea className="field-textarea" value={student.doelAfspraken || ''} onChange={e => patch({ doelAfspraken: e.target.value })} placeholder="Welk doel willen we bereiken?"/>
          ) : (
            <div className="field-value" style={{ whiteSpace: 'pre-wrap' }}>{student.doelAfspraken || <span className="muted">Nog niets ingevuld.</span>}</div>
          )}
        </div>
      </div>
    </div>
  );
}

function TabCLB({ student, editing, patch }) {
  return (
    <div>
      <div className="card card-pad section-block">
        <h4>CLB consult of traject</h4>
        <div className="radio-group">
          {['Consult', 'Traject'].map(opt => (
            <button key={opt} className={'radio-pill' + (student.clbType === opt ? ' selected' : '')} disabled={!editing} onClick={() => patch({ clbType: opt }, { type: 'CLB-type ingesteld', detail: opt })}>
              <span className="dot"></span>{opt}
            </button>
          ))}
          {student.clbType && editing && (
            <button className="btn btn-ghost btn-sm" onClick={() => patch({ clbType: '' })}>Wis</button>
          )}
        </div>
        <div className="field mt-2">
          <label className="field-label">Naam consulter(s) / trajecter(s)</label>
          {(() => {
            const namen = (student.clbNaam || '').split(',').map(n => n.trim()).filter(Boolean);
            const [newName, setNewName] = React.useState('');
            const addName = () => {
              const n = newName.trim();
              if (!n) return;
              const updated = [...namen, n].join(', ');
              patch({ clbNaam: updated }, { type: 'CLB-medewerker toegevoegd', detail: n });
              setNewName('');
            };
            const removeName = (idx) => {
              const removed = namen[idx];
              const updated = namen.filter((_, i) => i !== idx).join(', ');
              patch({ clbNaam: updated }, { type: 'CLB-medewerker verwijderd', detail: removed });
            };
            return editing ? (
              <div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: namen.length ? 8 : 0 }}>
                  {namen.map((n, i) => (
                    <span key={i} className="badge badge-lg badge-primary" style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                      {n}
                      <button onClick={() => removeName(i)} style={{ background: 'none', border: 'none', color: 'inherit', cursor: 'pointer', padding: '0 2px', fontSize: 14, lineHeight: 1, opacity: .7 }}>×</button>
                    </span>
                  ))}
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <input className="field-input" value={newName} onChange={e => setNewName(e.target.value)} placeholder="Naam toevoegen…"
                    onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addName(); } }}
                    style={{ flex: 1 }}/>
                  <button className="btn btn-sm btn-primary" onClick={addName} disabled={!newName.trim()}>
                    <Icon name="plus" size={12}/> Toevoegen
                  </button>
                </div>
              </div>
            ) : (
              <div className="field-value">
                {namen.length > 0 ? (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                    {namen.map((n, i) => <span key={i} className="badge badge-lg">{n}</span>)}
                  </div>
                ) : <span className="muted">—</span>}
              </div>
            );
          })()}
        </div>
      </div>

      <div className="card card-pad section-block">
        <h4>CLB-traject acties</h4>
        <CheckList items={CLB_ACTIES} value={student.clbActies} disabled={!editing} onChange={v => patch({ clbActies: v })}/>
      </div>

      <div className="detail-grid">
        <div className="card card-pad">
          <h4 style={{ marginTop: 0, fontSize: 13, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--text-muted)' }}>Doel CLB-traject</h4>
          {editing ? (
            <textarea className="field-textarea" value={student.clbDoel || ''} onChange={e => patch({ clbDoel: e.target.value })}/>
          ) : <div className="field-value" style={{ whiteSpace: 'pre-wrap' }}>{student.clbDoel || <span className="muted">Nog niets ingevuld.</span>}</div>}
        </div>

        <div>
          <div className="card card-pad section-block">
            <h4 style={{ marginTop: 0 }}>Fase CLB-traject</h4>
            <div className="radio-group">
              {FASES.map(f => {
                const cls = 'fase-' + f.toLowerCase().replace(/ /g, '-');
                return (
                  <button key={f} className={'radio-pill ' + cls + (student.fase === f ? ' selected' : '')} disabled={!editing} onClick={() => patch({ fase: f }, { type: 'Fase gewijzigd', detail: f })}>
                    <span className="dot"></span>{f}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="card card-pad section-block">
            <h4 style={{ marginTop: 0 }}>Evolutie CLB-traject</h4>
            <p className="muted" style={{ fontSize: 11.5, margin: '-6px 0 8px' }}>Hoe verloopt de begeleiding?</p>
            <div className="radio-group">
              {['Positief', 'Status quo', 'Negatief'].map(opt => (
                <button key={opt} className={'radio-pill' + (student.evolutieTraject === opt ? ' selected' : '')} disabled={!editing} onClick={() => patch({ evolutieTraject: opt }, { type: 'Evolutie CLB-traject', detail: opt })}>
                  <span className="dot"></span>{opt}
                </button>
              ))}
            </div>
          </div>
          <div className="card card-pad">
            <h4 style={{ marginTop: 0 }}>Evolutie afwezigheden</h4>
            <p className="muted" style={{ fontSize: 11.5, margin: '-6px 0 8px' }}>Nemen de B-codes toe of af?</p>
            <div className="radio-group">
              {['Positief', 'Status quo', 'Negatief'].map(opt => (
                <button key={opt} className={'radio-pill' + (student.evolutie === opt ? ' selected' : '')} disabled={!editing} onClick={() => patch({ evolutie: opt }, { type: 'Evolutie afwezigheden', detail: opt })}>
                  <span className="dot"></span>{opt}
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function TabExtern({ student, editing, patch, can }) {
  const canEdit = can ? can('extern_beheren') : true;
  function toggle(key, active) {
    const cur = student.diensten || {};
    const next = { ...cur, [key]: { ...(cur[key] || {}), active } };
    patch({ diensten: next }, { type: active ? 'Externe dienst toegevoegd' : 'Externe dienst verwijderd', detail: key });
  }
  function setNote(key, notitie) {
    const cur = student.diensten || {};
    patch({ diensten: { ...cur, [key]: { ...(cur[key] || { active: true }), notitie } } });
  }

  return (
    <div className="card card-pad">
      <h4 style={{ marginTop: 0 }}>Betrokken externe diensten</h4>
      <div className="check-list">
        {EXTERNE_DIENSTEN.map(d => {
          const entry = (student.diensten || {})[d.key] || {};
          const checked = !!entry.active;
          return (
            <div key={d.key} className={'check-item' + (checked ? ' checked' : '')} style={{ flexDirection: 'column', alignItems: 'stretch', cursor: 'default' }}>
              <label style={{ display: 'flex', alignItems: 'flex-start', gap: 11, cursor: canEdit ? 'pointer' : 'default' }}>
                <input type="checkbox" checked={checked} disabled={!canEdit} onChange={e => toggle(d.key, e.target.checked)}/>
                <div style={{ flex: 1 }}>
                  <div className="check-label">{d.label}</div>
                  <div className="check-desc">{d.desc}</div>
                </div>
              </label>
              {checked && (
                  <textarea
                    className="check-note"
                    placeholder="Optionele notitie…"
                    value={entry.notitie || ''}
                    onChange={e => setNote(d.key, e.target.value)}
                  />
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TabContact({ student, patch, can }) {

    const entry = { id: uid(), datum, methode, richting, metWie, bereikbaar, notitie: notitie.trim() };

    setNotitie('');

    toast('Contact verwijderd');

    <div>

            <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Methode</label>

              <select value={methode} onChange={e => setMethode(e.target.value)}>
                {METHODES.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
              <span className="chevron">▾</span>
            </div>
          </div>
          <div>
            <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Richting</label>
            <div className="radio-group">
              {['Uitgaand', 'Inkomend'].map(r => (
                <button key={r} className={'radio-pill' + (richting === r ? ' selected' : '')} onClick={() => setRichting(r)} style={{ padding: '5px 10px', fontSize: 12 }}>
                  <span className="dot"></span>{r}
