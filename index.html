          </div>
          <div>
            <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Met wie</label>
            <div className="filter-chip active" style={{ padding: '7px 14px', display: 'inline-flex', width: '100%', boxSizing: 'border-box' }}>
              <select value={metWie} onChange={e => setMetWie(e.target.value)}>
                {CONTACTEN.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <span className="chevron">▾</span>
            </div>
          </div>
          <div>
            <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Bereikbaar?</label>
            <div className="radio-group">
              {['Ja', 'Nee'].map(b => (
                <button key={b} className={'radio-pill' + (bereikbaar === b ? ' selected' : '')} onClick={() => setBereikbaar(b)}
                  style={{ padding: '5px 10px', fontSize: 12, ...(bereikbaar === b && b === 'Ja' ? { background: '#dcfce7', color: '#15803d', borderColor: '#22c55e' } : bereikbaar === b && b === 'Nee' ? { background: '#fee2e2', color: '#b91c1c', borderColor: '#ef4444' } : {}) }}>
                  <span className="dot" style={bereikbaar === b && b === 'Ja' ? { borderColor: '#22c55e', background: '#22c55e' } : bereikbaar === b && b === 'Nee' ? { borderColor: '#ef4444', background: '#ef4444' } : {}}></span>{b}
                </button>
              ))}
            </div>
          </div>
        </div>
        <label style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 4 }}>Notitie</label>
        <textarea className="field-textarea" value={notitie} onChange={e => setNotitie(e.target.value)} placeholder="Samenvatting van het contact…" style={{ minHeight: 60, marginBottom: 10 }}/>
        <button className="btn btn-primary" onClick={addEntry}><Icon name="plus" size={14}/> Registreren</button>
      </div>}

      {/* Log table */}
      <div className="card card-pad">
        <h4 style={{ marginTop: 0 }}>Contactgeschiedenis</h4>
        {log.length === 0 ? (
          <div className="empty"><div className="empty-text">Nog geen contacten geregistreerd.</div></div>
        ) : (
          <div className="table-wrap">
            <table className="data-table">
              <thead>
                <tr>
                  <th>Datum</th>
                  <th>Methode</th>
                  <th>Richting</th>
                  <th>Met wie</th>
                  <th>Bereikt</th>
                  <th>Notitie</th>
                  <th style={{ width: 40 }}></th>
                </tr>
              </thead>
              <tbody>
                {log.map(e => (
                  <tr key={e.id}>
                    <td style={{ whiteSpace: 'nowrap' }}>{fmtDate(e.datum)}</td>
                    <td><span className="badge">{e.methode}</span></td>
                    <td>{e.richting}</td>
                    <td>{e.metWie}</td>
                    <td>
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '2px 8px', borderRadius: 999, fontSize: 12, fontWeight: 600,
                        background: e.bereikbaar === 'Ja' ? '#dcfce7' : '#fee2e2',
                        color: e.bereikbaar === 'Ja' ? '#15803d' : '#b91c1c'
                      }}>
                        {e.bereikbaar === 'Ja' ? '✓ Ja' : '✗ Nee'}
                      </span>
                    </td>
                    <td style={{ maxWidth: 250, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{e.notitie || <span className="muted">—</span>}</td>
                    <td><button className="note-delete" onClick={() => removeEntry(e.id)} title="Verwijderen"><Icon name="trash" size={13}/></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        {log.length > 0 && (
          <div style={{ marginTop: 12, fontSize: 12, color: 'var(--text-muted)' }}>
            Totaal: {log.length} contacten · {log.filter(e => e.bereikbaar === 'Ja').length} bereikt · {log.filter(e => e.bereikbaar === 'Nee').length} niet bereikt
          </div>
        )}
      </div>
    </div>
  );
}

function TabStats({ student, state }) {
  const tl = [...(student.tijdlijn || [])].reverse(); // chronological
  const niveau = calcNiveau(student.bcodes, student.dcodes, state.thresholds, student.onderwijsvorm);

  // Build B-code evolution from timeline
  const bEvents = tl.filter(e => e.type && (e.type.includes('B-codes') || e.type.includes('B-code'))).map(e => {
    const m = (e.detail || '').match(/(\d+)\s*→\s*(\d+)/);
    return m ? { datum: e.datum, value: parseInt(m[2]) } : null;
  }).filter(Boolean);

  // Build D-code evolution
  const dEvents = tl.filter(e => e.type && (e.type.includes('D-codes') || e.type.includes('D-code'))).map(e => {
    const m = (e.detail || '').match(/(\d+)\s*→\s*(\d+)/);
    return m ? { datum: e.datum, value: parseInt(m[2]) } : null;
  }).filter(Boolean);

  // Build evolutie events
  const evoEvents = tl.filter(e => e.type && e.type.includes('Evolutie')).map(e => ({
    datum: e.datum, type: e.type, value: e.detail
  }));

  // Build fase events
  const faseEvents = tl.filter(e => e.type && e.type.includes('Fase')).map(e => ({
    datum: e.datum, value: e.detail
  }));

  // Add start + current for B-codes chart
  const regDate = student.datumRegistratie || (tl[0] || {}).datum || todayISO();
  const bLine = [];
  if (bEvents.length > 0) {
    // try to get initial value
    const firstM = (bEvents[0].value !== undefined) ? bEvents : [];
    bLine.push(...bEvents);
  }
  if (bLine.length === 0 || bLine[bLine.length - 1].value !== student.bcodes) {
    bLine.push({ datum: todayISO(), value: student.bcodes });
  }
  if (bLine.length === 1) {
    bLine.unshift({ datum: regDate, value: 0 });
  }

  const dLine = [];
  if (dEvents.length > 0) dLine.push(...dEvents);
  if (dLine.length === 0 || dLine[dLine.length - 1].value !== student.dcodes) {
    dLine.push({ datum: todayISO(), value: student.dcodes });
  }
  if (dLine.length === 1) dLine.unshift({ datum: regDate, value: 0 });

  // SVG Line Chart component
  function LineChart({ dataA, dataB, labelA, labelB, colorA, colorB }) {
    const allPoints = [...dataA, ...dataB];
    if (allPoints.length < 2) return <div className="muted" style={{ padding: 16 }}>Onvoldoende data voor grafiek.</div>;

    const dates = allPoints.map(p => new Date(p.datum).getTime());
    const minD = Math.min(...dates);
    const maxD = Math.max(...dates);
    const rawMax = Math.max(...allPoints.map(p => p.value), 1);
    const maxV = Math.ceil(rawMax * 1.2) || 1;
    const rangeD = maxD - minD || 1;

    const pad = { t: 12, r: 16, b: 28, l: 32 };
    const W = 700, H = 220;
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;

    const xP = d => pad.l + ((new Date(d).getTime() - minD) / rangeD) * cw;
    const yP = v => pad.t + ch - (v / maxV) * ch;
    const line = data => data.map((p, i) => `${i ? 'L' : 'M'}${xP(p.datum).toFixed(1)},${yP(p.value).toFixed(1)}`).join(' ');
    const area = data => { if (data.length < 2) return ''; return line(data) + `L${xP(data[data.length-1].datum).toFixed(1)},${yP(0).toFixed(1)}L${xP(data[0].datum).toFixed(1)},${yP(0).toFixed(1)}Z`; };

    const ySteps = 4;
    const yTicks = Array.from({ length: ySteps + 1 }, (_, i) => Math.round((maxV / ySteps) * i));
    const uDates = [...new Set(allPoints.map(p => p.datum))].sort();
    const xLabels = uDates.length <= 6 ? uDates : Array.from({ length: Math.min(5, uDates.length) }, (_, i) => uDates[Math.round(i * (uDates.length - 1) / (Math.min(5, uDates.length) - 1))]);

    return (
      <div>
        {/* Legend */}
        <div style={{ display: 'flex', gap: 16, marginBottom: 8, paddingLeft: 4 }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12, fontWeight: 600, color: colorA }}>
            <span style={{ width: 18, height: 3, background: colorA, borderRadius: 2, display: 'inline-block' }}></span> {labelA}
          </span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12, fontWeight: 600, color: colorB }}>
            <span style={{ width: 18, height: 3, background: colorB, borderRadius: 2, display: 'inline-block', backgroundImage: 'repeating-linear-gradient(90deg,' + colorB + ' 0,' + colorB + ' 4px,transparent 4px,transparent 7px)' }}></span> {labelB}
          </span>
        </div>
        <svg width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
          <defs>
            <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={colorA} stopOpacity=".15"/><stop offset="100%" stopColor={colorA} stopOpacity=".01"/></linearGradient>
            <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={colorB} stopOpacity=".12"/><stop offset="100%" stopColor={colorB} stopOpacity=".01"/></linearGradient>
          </defs>
          {/* Grid */}
          {yTicks.map(v => <React.Fragment key={v}>
            <line x1={pad.l} x2={W - pad.r} y1={yP(v)} y2={yP(v)} stroke="#e5e7eb" strokeWidth=".6" strokeDasharray="3 2"/>
            <text x={pad.l - 6} y={yP(v) + 3.5} textAnchor="end" fontSize="8" fill="#9ca3af">{v}</text>
          </React.Fragment>)}
          {/* X axis */}
          <line x1={pad.l} y1={yP(0)} x2={W - pad.r} y2={yP(0)} stroke="#d1d5db" strokeWidth=".8"/>
          {xLabels.map(d => <text key={d} x={xP(d)} y={H - 8} textAnchor="middle" fontSize="7.5" fill="#9ca3af">{fmtDate(d)}</text>)}
          {/* Areas */}
          {dataA.length >= 2 && <path d={area(dataA)} fill="url(#gA)"/>}
          {dataB.length >= 2 && <path d={area(dataB)} fill="url(#gB)"/>}
          {/* Lines */}
          {dataA.length >= 2 && <path d={line(dataA)} fill="none" stroke={colorA} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>}
          {dataB.length >= 2 && <path d={line(dataB)} fill="none" stroke={colorB} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="5 3"/>}
          {/* Dots + value labels for A */}
          {dataA.map((p, i) => <React.Fragment key={'a'+i}>
            <circle cx={xP(p.datum)} cy={yP(p.value)} r="3.5" fill="white" stroke={colorA} strokeWidth="2"/>
            <text x={xP(p.datum)} y={yP(p.value) - 7} textAnchor="middle" fontSize="7.5" fontWeight="700" fill={colorA}>{p.value}</text>
          </React.Fragment>)}
          {/* Dots + value labels for B */}
          {dataB.map((p, i) => <React.Fragment key={'b'+i}>
            <circle cx={xP(p.datum)} cy={yP(p.value)} r="3.5" fill="white" stroke={colorB} strokeWidth="2"/>
            <text x={xP(p.datum)} y={yP(p.value) + 13} textAnchor="middle" fontSize="7.5" fontWeight="700" fill={colorB}>{p.value}</text>
          </React.Fragment>)}
        </svg>
      </div>
    );
  }

  // Timeline activity per month
  const actPerMonth = {};
  tl.forEach(e => {
    const m = e.datum ? e.datum.substring(0, 7) : null;
    if (m) actPerMonth[m] = (actPerMonth[m] || 0) + 1;
  });

  // School actions count
  const schoolActCount = Object.values(student.schoolActies || {}).filter(Boolean).length;
  const clbActCount = Object.values(student.clbActies || {}).filter(Boolean).length;
  const dienstCount = Object.values(student.diensten || {}).filter(d => d.active).length;
  const daysActive = Math.max(1, Math.round((new Date() - new Date(regDate)) / 86400000));

  return (
    <div>
      {/* KPI row */}
      <div className="stats-grid" style={{ marginBottom: 16 }}>
        <div className="stat-card">
          <div className="stat-label">B-codes</div>
          <div className="stat-value" style={{ color: 'var(--niv3)' }}>{student.bcodes}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">D-codes</div>
          <div className="stat-value" style={{ color: 'var(--warning)' }}>{student.dcodes}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Niveau</div>
          <div className="stat-value"><span className={'badge ' + nivClass(niveau)}><span className="badge-dot"></span> N{niveau}</span></div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Dagen in opvolging</div>
          <div className="stat-value">{daysActive}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Tijdlijn events</div>
          <div className="stat-value">{tl.length}</div>
        </div>
      </div>

      {/* B/D codes evolution chart + Activity per month side by side */}
      <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 0.8fr', gap: 16, marginBottom: 16 }}>
        <div className="card card-pad">
          <div className="card-title">Evolutie B- en D-codes</div>
          <p className="muted" style={{ fontSize: 12, marginTop: -4, marginBottom: 12 }}>Verloop van problematische afwezigheden en te-laat-meldingen over tijd</p>
          <LineChart dataA={bLine} dataB={dLine} labelA="B-codes" labelB="D-codes" colorA="#ef4444" colorB="#f59e0b"/>
        </div>
        {Object.keys(actPerMonth).length > 0 && (
          <div className="card card-pad">
            <div className="card-title">Activiteit per maand</div>
            <p className="muted" style={{ fontSize: 12, marginTop: -4, marginBottom: 12 }}>Aantal tijdlijn-events per maand</p>
            <div className="bar-chart" style={{ marginTop: 4 }}>
              {Object.entries(actPerMonth).sort(([a], [b]) => a.localeCompare(b)).map(([month, count]) => (
                <div className="bar-row" key={month}>
                  <span className="bar-label">{fmtDate(month + '-01').replace(/\d+\s/, '')}</span>
                  <div className="bar-track">
                    <div className="bar-seg" style={{ width: (count / Math.max(...Object.values(actPerMonth)) * 100) + '%', background: 'var(--primary)' }}/>
                  </div>
                  <span className="bar-val">{count}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Evolutie events timeline */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16, marginBottom: 16 }}>
        <div className="card card-pad">
          <div className="card-title">Evolutie-verloop traject</div>
          {evoEvents.length === 0 ? <p className="muted" style={{ fontSize: 12.5 }}>Nog geen evolutie-wijzigingen geregistreerd.</p> : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 8 }}>
              {evoEvents.map((e, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <span style={{ fontSize: 11, color: 'var(--text-muted)', minWidth: 75 }}>{fmtDate(e.datum)}</span>
                  <span style={{ fontSize: 11, color: 'var(--text-muted)', minWidth: 110 }}>{e.type.replace('Evolutie ', '')}</span>
                  <span className={'badge ' + (e.value === 'Positief' ? 'badge-success' : e.value === 'Negatief' ? 'badge-danger' : '')} style={{
                    background: e.value === 'Positief' ? '#dcfce7' : e.value === 'Negatief' ? '#fee2e2' : '#fef3c7',
                    color: e.value === 'Positief' ? '#15803d' : e.value === 'Negatief' ? '#b91c1c' : '#b45309',
                    padding: '3px 10px', borderRadius: 999, fontSize: 12, fontWeight: 600
                  }}>
                    {e.value === 'Positief' ? '↑' : e.value === 'Negatief' ? '↓' : '↔'} {e.value}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="card card-pad">
          <div className="card-title">Fase-verloop</div>
          {faseEvents.length === 0 ? <p className="muted" style={{ fontSize: 12.5 }}>Nog geen fase-wijzigingen geregistreerd.</p> : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 8 }}>
              {faseEvents.map((e, i) => {
                const fc = { 'In opstart': ['#fef3c7', '#b45309'], 'Lopende': ['#dbeafe', '#1d4ed8'], 'Moeizaam': ['#fee2e2', '#b91c1c'], 'Afgerond': ['#dcfce7', '#15803d'] };
                const c = fc[e.value] || ['var(--bg-elevated)', 'var(--text)'];
                return (
                  <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span style={{ fontSize: 11, color: 'var(--text-muted)', minWidth: 75 }}>{fmtDate(e.datum)}</span>
                    <span style={{ background: c[0], color: c[1], padding: '3px 10px', borderRadius: 999, fontSize: 12, fontWeight: 600 }}>{e.value}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="card card-pad">
          <div className="card-title">Ingezette acties</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 8 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 13 }}>Schoolacties</span>
              <span style={{ fontWeight: 700, fontSize: 18 }}>{schoolActCount}</span>
            </div>
            <div style={{ width: '100%', height: 6, background: 'var(--border)', borderRadius: 3 }}>
              <div style={{ width: Math.min(100, schoolActCount * 15) + '%', height: '100%', background: 'var(--primary)', borderRadius: 3, transition: 'width .4s' }}/>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 13 }}>CLB-acties</span>
              <span style={{ fontWeight: 700, fontSize: 18 }}>{clbActCount}</span>
            </div>
            <div style={{ width: '100%', height: 6, background: 'var(--border)', borderRadius: 3 }}>
              <div style={{ width: Math.min(100, clbActCount * 15) + '%', height: '100%', background: 'var(--niv2)', borderRadius: 3, transition: 'width .4s' }}/>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 13 }}>Externe diensten</span>
              <span style={{ fontWeight: 700, fontSize: 18 }}>{dienstCount}</span>
            </div>
            <div style={{ width: '100%', height: 6, background: 'var(--border)', borderRadius: 3 }}>
              <div style={{ width: Math.min(100, dienstCount * 25) + '%', height: '100%', background: 'var(--warning)', borderRadius: 3, transition: 'width .4s' }}/>
            </div>
          </div>
        </div>
      </div>

      {/* Absence calendar */}
      {(() => {
        const [calMonth, setCalMonth] = React.useState(() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); });
        const year = parseInt(calMonth.split('-')[0]);
        const month = parseInt(calMonth.split('-')[1]) - 1;
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const offset = (firstDay + 6) % 7; // monday = 0
        const monthNames = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

        // Find B-code events in this month
        const bDates = new Set();
        tl.filter(e => e.type && (e.type.includes('B-codes') || e.type.includes('B-code') || e.type.includes('Schoolactie') || e.type.includes('afwezig'))).forEach(e => {
          if (e.datum && e.datum.startsWith(calMonth)) bDates.add(parseInt(e.datum.split('-')[2]));
        });
        // Also mark contact log dates
        const contactDates = new Set();
        (student.contactLog || []).forEach(e => {
          if (e.datum && e.datum.startsWith(calMonth)) contactDates.add(parseInt(e.datum.split('-')[2]));
        });
        // Timeline event dates
        const eventDates = new Set();
        tl.forEach(e => {
          if (e.datum && e.datum.startsWith(calMonth)) eventDates.add(parseInt(e.datum.split('-')[2]));
        });

        const prevMonth = () => {
          const d = new Date(year, month - 1, 1);
          setCalMonth(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
        };
        const nextMonth = () => {
          const d = new Date(year, month + 1, 1);
          setCalMonth(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
        };

        return (
          <div className="card card-pad" style={{ marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
              <div className="card-title" style={{ margin: 0 }}>Kalenderoverzicht</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <button className="btn btn-sm" onClick={prevMonth}><Icon name="chevLeft" size={12}/></button>
                <span style={{ fontWeight: 600, fontSize: 14, minWidth: 130, textAlign: 'center' }}>{monthNames[month]} {year}</span>
                <button className="btn btn-sm" onClick={nextMonth}><Icon name="chevRight" size={12}/></button>
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2, textAlign: 'center' }}>
              {['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'].map(d => (
                <div key={d} style={{ fontSize: 10, fontWeight: 700, color: 'var(--text-muted)', padding: '4px 0' }}>{d}</div>
              ))}
              {Array.from({ length: offset }).map((_, i) => <div key={'e' + i}/>)}
              {Array.from({ length: daysInMonth }).map((_, i) => {
                const day = i + 1;
                const isWeekend = (offset + i) % 7 >= 5;
                const hasEvent = eventDates.has(day);
                const hasBcode = bDates.has(day);
                const hasContact = contactDates.has(day);
                return (
                  <div key={day} style={{
                    padding: '6px 2px', borderRadius: 6, fontSize: 12, fontWeight: hasEvent ? 700 : 400,
                    background: hasBcode ? '#fee2e2' : hasContact ? '#dbeafe' : hasEvent ? '#fef3c7' : isWeekend ? 'var(--bg-elevated)' : 'transparent',
                    color: hasBcode ? '#b91c1c' : hasContact ? '#1d4ed8' : isWeekend ? 'var(--text-faint)' : 'var(--text)',
                    position: 'relative'
                  }} title={[hasBcode && 'B-code event', hasContact && 'Contact', hasEvent && !hasBcode && !hasContact && 'Tijdlijn event'].filter(Boolean).join(', ')}>
                    {day}
                    {(hasBcode || hasContact) && <div style={{ width: 4, height: 4, borderRadius: '50%', background: hasBcode ? '#ef4444' : '#3b82f6', position: 'absolute', bottom: 2, left: '50%', transform: 'translateX(-50%)' }}/>}
                  </div>
                );
              })}
            </div>
            <div style={{ display: 'flex', gap: 16, marginTop: 10, fontSize: 11, color: 'var(--text-muted)' }}>
              <span><span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 2, background: '#fee2e2', marginRight: 4 }}/>B-code / afwezigheid</span>
              <span><span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 2, background: '#dbeafe', marginRight: 4 }}/>Contact</span>
              <span><span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 2, background: '#fef3c7', marginRight: 4 }}/>Ander event</span>
            </div>
          </div>
        );
      })()}

    </div>
  );
}

function TabTijdlijn({ student }) {
  const items = student.tijdlijn || [];
  if (items.length === 0) return <div className="card"><div className="empty"><div className="empty-text">Nog geen tijdlijn-events.</div></div></div>;
  return (
    <div className="card card-pad">
      <div className="timeline">
        {items.map((it, i) => (
          <div className="timeline-item" key={i}>
            <div className="timeline-date">{fmtDate(it.datum)}{it.door && <> · door <strong style={{ color: 'var(--text)' }}>{it.door}</strong>{it.rol && <span className="muted"> · {it.rol}</span>}</>}</div>
            <div className="timeline-title">{it.type}</div>

function TabOpmerkingen({ student, patch }) {
  const [text, setText] = React.useState('');
  const toast = useToast();
  function add() {
    if (!text.trim()) return;
    const note = { id: uid(), datum: todayISO(), text: text.trim() };
    const next = [note, ...(student.notities || [])];
    patch({ notities: next }, { type: 'Opmerking toegevoegd', detail: text.slice(0, 60) + (text.length > 60 ? '…' : '') });
    setText('');
    toast('Opmerking toegevoegd');
  }
  function remove(id) {
    if (!confirm('Deze opmerking verwijderen?')) return;
    patch({ notities: (student.notities || []).filter(n => n.id !== id) });
    toast('Opmerking verwijderd');
  }
  return (
    <div className="card card-pad">
      <h4 style={{ marginTop: 0 }}>Nieuwe opmerking</h4>
      <textarea className="field-textarea" value={text} onChange={e => setText(e.target.value)} placeholder="Schrijf een notitie. Opmerkingen kunnen na opslaan niet meer bewerkt worden."/>
      <div style={{ marginTop: 10, marginBottom: 18 }}>
        <button className="btn btn-primary" onClick={add} disabled={!text.trim()}>
          <Icon name="plus" size={14}/> Opmerking toevoegen
        </button>
      </div>
      <div className="divider"></div>
      <h4 style={{ fontSize: 13, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--text-muted)' }}>Eerdere opmerkingen</h4>
      {(student.notities || []).length === 0 && <div className="muted" style={{ fontSize: 13, padding: '12px 0' }}>Nog geen opmerkingen.</div>}
      {(student.notities || []).map(n => (
        <div className="note-item" key={n.id}>
          <div className="note-meta">
            <span>{fmtDate(n.datum)}</span>
            <button className="note-delete" onClick={() => remove(n.id)} title="Verwijderen"><Icon name="trash" size={14}/></button>
          </div>
          <div className="note-text">{n.text}</div>
        </div>
      ))}
    </div>
  );
}
